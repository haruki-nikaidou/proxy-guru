<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" width="640" height="650" role="img" font-family="system-ui, sans-serif">
  <title>The canvas stores servers, pods, exits, edges and one route tree per pod; it draws the same
    graph compressed into splitter cards, aggregator cards and buses, which are computed and never
    stored.</title>

  <!--
    Drawn at the docs content width (640px) so it renders 1:1 and the 10-14px labels stay that size;
    that is why the two panels are stacked instead of standing side by side.

    Fixed light panel, no `prefers-color-scheme`: loaded through an <img>, this file cannot see the
    theme Starlight sets on <html>, so a media query would invert it whenever the site theme and the
    OS preference disagree. Painting its own background instead lets one palette be measurably
    readable on either site theme, and matches the light dashboard screenshots around it. Same
    palette as img/rollout/edit-to-applied.svg. Contrast against that panel: every label 7.5:1 or
    better, accent text 5.5:1 (teal) and 7.1:1 (violet), card and edge strokes 7.6:1. The hairlines
    that separate rows are decorative only.
  -->
  <style>
    .panel       { fill: #ffffff; }
    .panel-title { font-size: 14px; font-weight: 600; fill: #0f172a; }
    .card        { fill: none; stroke: #475569; stroke-width: 1.2; }
    .card-title  { font-size: 12px; font-weight: 600; fill: #0f172a; }
    .pod         { font-size: 11px; fill: #1f2937; }
    .note        { font-size: 10px; font-style: italic; fill: #4b5563; }
    .rule        { stroke: #cbd5e1; stroke-width: 1; }
    .edge        { fill: none; stroke: #475569; stroke-width: 1.1; }
    .caption     { font-size: 11px; font-style: italic; fill: #4b5563; }
    .divider     { stroke: #cbd5e1; stroke-width: 1; }
    .flow        { font-size: 11px; font-style: italic; fill: #4b5563; }

    /* accent 1: the exit, in both panels */
    .exit-box    { fill: none; stroke: #0f766e; stroke-width: 1.2; }
    .exit-tag    { font-size: 10px; fill: #0f766e; }
    .exit-name   { font-size: 12px; font-weight: 600; fill: #0f766e; }

    /* accent 2: everything the canvas computes instead of storing */
    .derived       { fill: none; stroke: #6d28d9; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .derived-title { font-size: 12px; font-weight: 600; fill: #6d28d9; }
    .derived-sub   { font-size: 10px; fill: #6d28d9; }
    .derived-row   { font-size: 11px; fill: #6d28d9; }
    .derived-rule  { stroke: #6d28d9; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.55; }
    .edge-derived  { fill: none; stroke: #6d28d9; stroke-width: 1.1; }
    .bus-label     { font-size: 10px; font-style: italic; fill: #6d28d9; }
    .badge         { fill: none; stroke: #6d28d9; stroke-width: 1; }
    .badge-text    { font-size: 10px; fill: #6d28d9; }
  </style>

  <rect class="panel" x="0" y="0" width="640" height="650" rx="10" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0.8 L9,5 L0,9.2 Z" fill="#475569" />
    </marker>
    <marker id="arrow-derived" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0.8 L9,5 L0,9.2 Z" fill="#6d28d9" />
    </marker>
  </defs>

  <!-- ===================== top panel: what is stored ===================== -->
  <text class="panel-title" x="320" y="30" text-anchor="middle">What is stored</text>

  <!-- server guru-test-sg, three client pods, each with its route tree -->
  <rect class="card" x="28" y="48" width="180" height="129" rx="8" />
  <text class="card-title" x="40" y="69">guru-test-sg</text>
  <line class="rule" x1="28" y1="78" x2="208" y2="78" />
  <line class="rule" x1="28" y1="111" x2="208" y2="111" />
  <line class="rule" x1="28" y1="144" x2="208" y2="144" />
  <text class="pod"  x="40" y="93">plain</text>
  <text class="note" x="40" y="105">route: balance ×1 / ×1</text>
  <text class="pod"  x="40" y="126">web</text>
  <text class="note" x="40" y="138">route: balance ×1 / ×1</text>
  <text class="pod"  x="40" y="159">direct</text>
  <text class="note" x="40" y="171">route: single way on</text>

  <!-- server guru-test-us-1, two relay pods -->
  <rect class="card" x="356" y="48" width="180" height="96" rx="8" />
  <text class="card-title" x="368" y="69">guru-test-us-1</text>
  <line class="rule" x1="356" y1="78" x2="536" y2="78" />
  <line class="rule" x1="356" y1="111" x2="536" y2="111" />
  <text class="pod"  x="368" y="93">plain</text>
  <text class="note" x="368" y="105">route: single way on</text>
  <text class="pod"  x="368" y="126">web</text>
  <text class="note" x="368" y="138">route: single way on</text>

  <!-- the exit both servers reach -->
  <rect class="exit-box" x="232" y="230" width="176" height="54" rx="8" />
  <text class="exit-tag"  x="320" y="250" text-anchor="middle">exit</text>
  <text class="exit-name" x="320" y="268" text-anchor="middle">example.com:80</text>

  <!-- the seven stored edges: two between the servers, five into the exit -->
  <path class="edge" d="M208,95 L356,95" marker-end="url(#arrow)" />
  <path class="edge" d="M208,128 L356,128" marker-end="url(#arrow)" />
  <path class="edge" d="M208,95 L236,95 L236,198 L300,198 L300,230" marker-end="url(#arrow)" />
  <path class="edge" d="M208,128 L226,128 L226,206 L276,206 L276,230" marker-end="url(#arrow)" />
  <path class="edge" d="M208,161 L216,161 L216,214 L252,214 L252,230" marker-end="url(#arrow)" />
  <path class="edge" d="M536,95 L556,95 L556,206 L388,206 L388,230" marker-end="url(#arrow)" />
  <path class="edge" d="M536,128 L544,128 L544,190 L364,190 L364,230" marker-end="url(#arrow)" />

  <text class="caption" x="320" y="306" text-anchor="middle">servers, pods, exits, edges, one route tree per pod</text>

  <!-- ===================== the transition ===================== -->
  <line class="divider" x1="28" y1="336" x2="270" y2="336" />
  <line class="divider" x1="372" y1="336" x2="612" y2="336" />
  <text class="flow" x="308" y="340" text-anchor="middle">drawn as</text>
  <line class="edge" x1="348" y1="324" x2="348" y2="348" marker-end="url(#arrow)" />

  <!-- ===================== bottom panel: what is drawn ===================== -->
  <text class="panel-title" x="320" y="376" text-anchor="middle">What is drawn</text>

  <!-- the same client server, routes no longer on the card -->
  <rect class="card" x="20" y="394" width="130" height="106" rx="8" />
  <text class="card-title" x="32" y="413">guru-test-sg</text>
  <line class="rule" x1="20" y1="422" x2="150" y2="422" />
  <line class="rule" x1="20" y1="448" x2="150" y2="448" />
  <line class="rule" x1="20" y1="474" x2="150" y2="474" />
  <text class="pod" x="32" y="439">plain</text>
  <text class="pod" x="32" y="465">web</text>
  <text class="pod" x="32" y="491">direct</text>

  <!-- computed splitter card: both balance routes collapse into one card -->
  <rect class="derived" x="190" y="388" width="160" height="96" rx="8" />
  <text class="derived-title" x="202" y="408">Balance</text>
  <text class="derived-sub"   x="202" y="421">2 routes</text>
  <line class="derived-rule" x1="190" y1="427" x2="350" y2="427" />
  <line class="derived-rule" x1="190" y1="455" x2="350" y2="455" />
  <text class="derived-row" x="202" y="446">guru-test-us-1</text>
  <text class="derived-row" x="338" y="446" text-anchor="end">×1</text>
  <text class="derived-row" x="202" y="474">example.com</text>
  <text class="derived-row" x="338" y="474" text-anchor="end">×1</text>

  <!-- the same relay server -->
  <rect class="card" x="480" y="394" width="140" height="80" rx="8" />
  <text class="card-title" x="492" y="413">guru-test-us-1</text>
  <line class="rule" x1="480" y1="422" x2="620" y2="422" />
  <line class="rule" x1="480" y1="448" x2="620" y2="448" />
  <text class="pod" x="492" y="439">plain</text>
  <text class="pod" x="492" y="465">web</text>

  <!-- computed aggregator card: every line in front of the exit meets here -->
  <rect class="derived" x="190" y="548" width="140" height="54" rx="8" />
  <text class="derived-title" x="260" y="570" text-anchor="middle">2 servers</text>
  <text class="derived-sub"   x="260" y="586" text-anchor="middle">one way out</text>

  <!-- the same exit, now with a single line into it -->
  <rect class="exit-box" x="438" y="548" width="182" height="54" rx="8" />
  <text class="exit-tag"  x="529" y="568" text-anchor="middle">exit</text>
  <text class="exit-name" x="529" y="586" text-anchor="middle">example.com:80</text>

  <!-- drawn cables -->
  <path class="edge-derived" d="M150,435 L190,418" marker-end="url(#arrow-derived)" />
  <path class="edge-derived" d="M150,461 L190,436" marker-end="url(#arrow-derived)" />
  <path class="edge-derived" d="M350,441 L480,441" marker-end="url(#arrow-derived)" />
  <path class="edge-derived" d="M260,484 L260,548" marker-end="url(#arrow-derived)" />
  <path class="edge" d="M150,487 L170,487 L170,574 L190,574" marker-end="url(#arrow)" />
  <path class="edge" d="M550,474 L550,518 L300,518 L300,548" marker-end="url(#arrow)" />
  <path class="edge-derived" d="M330,575 L438,575" marker-end="url(#arrow-derived)" />

  <!-- the cable to the relay server is one bus standing for two edges -->
  <rect class="badge" x="398" y="394" width="20" height="19" rx="5" />
  <text class="badge-text" x="408" y="408" text-anchor="middle">2</text>
  <line class="edge-derived" x1="408" y1="413" x2="408" y2="438" />
  <text class="bus-label" x="392" y="408" text-anchor="end">bus</text>

  <text class="caption" x="320" y="626" text-anchor="middle">splitters, aggregators and buses are computed, never stored</text>
</svg>
