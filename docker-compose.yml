name: guru

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    container_name: guru-surrealdb
    restart: unless-stopped
    # The image runs as `nonroot`, which cannot write the root-owned ./data/db.
    user: root
    command:
      - start
      - --user
      - ${SURREALDB_USER}
      - --pass
      - ${SURREALDB_PASSWORD}
      - rocksdb:/data/guru.db
    volumes:
      - ./data/db:/data
    ports:
      - "127.0.0.1:8000:8000"

  rabbitmq:
    image: rabbitmq:4-alpine
    container_name: guru-rabbitmq
    # The node name (rabbit@<hostname>) selects the data directory; pin it so the
    # data survives container recreation.
    hostname: guru-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - ./data/mq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: guru-redis
    restart: unless-stopped
    # Pub/sub only: nothing is persisted. The data directory is mounted like the
    # other stores' so the layout under ./data is uniform, not because anything
    # lands there.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - ./data/redis:/data
    ports:
      # REDIS_PORT moves the host side off 6379 on a box where something else
      # already listens there; REDIS_URL must name the same port.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
