name: guru

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: guru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: guru
    # Three guru-master processes x a pool of 10, the test runner's throwaway
    # databases, and manage-tool: a hundred is plenty and is the image default,
    # pinned so a future default cannot surprise the pools.
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      # The 18-series image mounts the whole cluster at /var/lib/postgresql
      # (earlier series used /var/lib/postgresql/data). Mounting the old path on
      # this image leaves the data on the container's writable layer, lost on
      # recreate.
      - ./data/pg:/var/lib/postgresql
      # Runs once, on first initialisation only: creates the `guru_test` database
      # `#[sqlx::test]` needs. Never touched again.
      - ./data/pg-init:/docker-entrypoint-initdb.d:ro
    ports:
      # POSTGRES_PORT moves the host side off 5432: the box's own PostgreSQL owns it.
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guru -d guru"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-alpine
    container_name: guru-rabbitmq
    # The node name (rabbit@<hostname>) selects the data directory; pin it so the
    # data survives container recreation.
    hostname: guru-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - ./data/mq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: guru-redis
    restart: unless-stopped
    # Pub/sub only: nothing is persisted. The data directory is mounted like the
    # other stores' so the layout under ./data is uniform, not because anything
    # lands there.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - ./data/redis:/data
    ports:
      # REDIS_PORT moves the host side off 6379 on a box where something else
      # already listens there; REDIS_URL must name the same port.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
