name = "orchestration"
tags = ["orchestration"]

[[cases]]
name = "orchestration_tables_visible"
kind = "schema_metadata"
sql = "INFO FOR DB;"
contains = ["orchestration_canvas", "orchestration_server", "server_ip_record", "orchestration_node", "orchestration_port", "orchestration_edge_connection", "orchestration_server_config_view", "orchestration_job_run"]

# The "at most one edge per port" invariant is enforced by the database, not only
# by the topology checker: without UNIQUE, two concurrent connects both persist.
[[cases]]
name = "edge_endpoint_indexes_are_unique"
kind = "schema_metadata"
sql = "INFO FOR TABLE orchestration_edge_connection;"
contains = [
    "DEFINE INDEX orchestration_edge_connection_in ON orchestration_edge_connection FIELDS in UNIQUE",
    "DEFINE INDEX orchestration_edge_connection_out ON orchestration_edge_connection FIELDS out UNIQUE",
]

# Exactly one config view row per server.
[[cases]]
name = "config_view_server_index_is_unique"
kind = "schema_metadata"
sql = "INFO FOR TABLE orchestration_server_config_view;"
contains = [
    "DEFINE INDEX orchestration_server_config_view_server ON orchestration_server_config_view FIELDS server UNIQUE",
]

# The derivation fence compares these two counters, so both must be integers that
# start at 0 on a freshly created canvas.
[[cases]]
name = "canvas_generation_counters"
kind = "schema_metadata"
sql = "INFO FOR TABLE orchestration_canvas;"
contains = [
    "DEFINE FIELD generation ON orchestration_canvas TYPE int DEFAULT 0",
    "DEFINE FIELD derived_generation ON orchestration_canvas TYPE int DEFAULT 0",
]

# Stage-1 per-pod isolation: a pod that cannot be derived is recorded on its
# server's config view row while the rest of the server's config is published,
# so the field must exist and default to an empty array — the Rust side reads it
# as `Vec<InvalidPod>`, which cannot decode a missing/NONE value. FLEXIBLE is
# what lets the four keys of each element survive a SCHEMAFULL table.
[[cases]]
name = "config_view_stores_invalid_pods"
kind = "schema_metadata"
sql = "INFO FOR TABLE orchestration_server_config_view;"
contains = [
    "DEFINE FIELD invalid_pods ON orchestration_server_config_view TYPE array<object> FLEXIBLE DEFAULT []",
]

[[cases]]
name = "config_view_row_without_invalid_pods_reads_back_empty"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:empty_pods CONTENT { name: "c", description: "" };
CREATE orchestration_server:empty_pods CONTENT { canvas: orchestration_canvas:empty_pods, name: "s", icon: "", comment: "", position: { x: 0, y: 0 }, ipv6_resolve: "tolerated", log_level: "info" };
CREATE orchestration_server_config_view:empty_pods CONTENT { server: orchestration_server:empty_pods, desired: NONE, in_flight: NONE, applied: NONE, failed_revision: NONE, apply_error: NONE, derive_error: NONE, waiting_for: [] };
RETURN array::len(orchestration_server_config_view:empty_pods.invalid_pods);
"""
allow = true

[[cases]]
name = "config_view_round_trips_invalid_pod_objects"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:round_trip CONTENT { name: "c", description: "" };
CREATE orchestration_server:round_trip CONTENT { canvas: orchestration_canvas:round_trip, name: "s", icon: "", comment: "", position: { x: 0, y: 0 }, ipv6_resolve: "tolerated", log_level: "info" };
CREATE server_ip_record:round_trip CONTENT { server: orchestration_server:round_trip, ip: "10.0.0.1", country: "JP" };
CREATE orchestration_node:round_trip CONTENT { canvas: orchestration_canvas:round_trip, name: "pod", comment: "", spec: { type: "pod", config: { ip: server_ip_record:round_trip, port: 8080 } }, position: { x: 0, y: 0 } };
CREATE orchestration_server_config_view:round_trip CONTENT { server: orchestration_server:round_trip, desired: NONE, in_flight: NONE, applied: NONE, failed_revision: NONE, apply_error: NONE, derive_error: NONE, invalid_pods: [{ node: orchestration_node:round_trip, pod: "pod", listen: "10.0.0.1:8080", error: "listen input is not fed by a pod" }], waiting_for: [] };
RETURN orchestration_server_config_view:round_trip.invalid_pods[0];
"""
allow = true

# A pod's `spec.config.ip` is what attributes the pod to a server during
# derivation. A dangling link is the one derivation failure that belongs to no
# server, so it could neither be published nor reported as an invalid pod: the
# database refuses it outright. The shape below must match what `NodeSpec`
# actually serialises — a tagged enum, i.e. `{ type, config }` — or the case
# would pass while the real write path stays unguarded.
[[cases]]
name = "pod_with_existing_ip_is_accepted"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:sound_ip CONTENT { name: "c", description: "" };
CREATE orchestration_server:sound_ip CONTENT { canvas: orchestration_canvas:sound_ip, name: "s", icon: "", comment: "", position: { x: 0, y: 0 }, ipv6_resolve: "tolerated", log_level: "info" };
CREATE server_ip_record:sound_ip CONTENT { server: orchestration_server:sound_ip, ip: "10.0.0.2", country: "JP" };
CREATE orchestration_node:sound_ip CONTENT { canvas: orchestration_canvas:sound_ip, name: "pod", comment: "", spec: { type: "pod", config: { ip: server_ip_record:sound_ip, port: 8080 } }, position: { x: 0, y: 0 } };
"""
allow = true

[[cases]]
name = "pod_with_dangling_ip_is_rejected"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:dangling_ip CONTENT { name: "c", description: "" };
CREATE orchestration_node:dangling_ip CONTENT { canvas: orchestration_canvas:dangling_ip, name: "pod", comment: "", spec: { type: "pod", config: { ip: server_ip_record:ghost, port: 8080 } }, position: { x: 0, y: 0 } };
"""
allow = false
error_contains = "spec.config.ip"

# An ip record outside the pod's canvas *tree* is as unusable as a missing one:
# derivation loads one tree at a time.
[[cases]]
name = "pod_with_foreign_canvas_ip_is_rejected"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:scope_a CONTENT { name: "a", description: "" };
CREATE orchestration_canvas:scope_b CONTENT { name: "b", description: "" };
CREATE orchestration_server:scope_a CONTENT { canvas: orchestration_canvas:scope_a, name: "s", icon: "", comment: "", position: { x: 0, y: 0 }, ipv6_resolve: "tolerated", log_level: "info" };
CREATE server_ip_record:scope_a CONTENT { server: orchestration_server:scope_a, ip: "10.0.0.3", country: "JP" };
CREATE orchestration_node:scope_cross CONTENT { canvas: orchestration_canvas:scope_b, name: "pod", comment: "", spec: { type: "pod", config: { ip: server_ip_record:scope_a, port: 8080 } }, position: { x: 0, y: 0 } };
"""
allow = false
error_contains = "spec.config.ip"

# A subcanvas may run a pod on a server of its parent: the tree is derived as a
# whole, so the ip is resolvable.
[[cases]]
name = "pod_with_parent_tree_ip_is_accepted"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:tree_ip_root CONTENT { name: "root", description: "" };
CREATE orchestration_canvas:tree_ip_sub CONTENT { name: "sub", description: "" };
CREATE orchestration_node:tree_ip_import CONTENT { canvas: orchestration_canvas:tree_ip_root, name: "sub", comment: "", spec: { type: "canvas_import", config: { canvas: orchestration_canvas:tree_ip_sub } }, position: { x: 0, y: 0 } };
CREATE orchestration_server:tree_ip_root CONTENT { canvas: orchestration_canvas:tree_ip_root, name: "s", icon: "", comment: "", position: { x: 0, y: 0 }, ipv6_resolve: "tolerated", log_level: "info" };
CREATE server_ip_record:tree_ip_root CONTENT { server: orchestration_server:tree_ip_root, ip: "10.0.0.4", country: "JP" };
CREATE orchestration_node:tree_ip_pod CONTENT { canvas: orchestration_canvas:tree_ip_sub, name: "pod", comment: "", spec: { type: "pod", config: { ip: server_ip_record:tree_ip_root, port: 8080 } }, position: { x: 0, y: 0 } };
"""
allow = true

# The import index is UNIQUE on `spec.config.canvas`; every non-import node
# stores NONE there and must not collide.
[[cases]]
name = "two_non_import_nodes_do_not_collide_on_the_import_index"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:no_collide CONTENT { name: "c", description: "" };
CREATE orchestration_node:no_collide_a CONTENT { canvas: orchestration_canvas:no_collide, name: "a", comment: "", spec: { type: "exit", config: { destination: "a", udp_addr: NONE } }, position: { x: 0, y: 0 } };
CREATE orchestration_node:no_collide_b CONTENT { canvas: orchestration_canvas:no_collide, name: "b", comment: "", spec: { type: "exit", config: { destination: "b", udp_addr: NONE } }, position: { x: 0, y: 0 } };
"""
allow = true

[[cases]]
name = "a_canvas_can_be_imported_once"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:once_a CONTENT { name: "a", description: "" };
CREATE orchestration_canvas:once_b CONTENT { name: "b", description: "" };
CREATE orchestration_canvas:once_sub CONTENT { name: "sub", description: "" };
CREATE orchestration_node:once_a CONTENT { canvas: orchestration_canvas:once_a, name: "sub", comment: "", spec: { type: "canvas_import", config: { canvas: orchestration_canvas:once_sub } }, position: { x: 0, y: 0 } };
CREATE orchestration_node:once_b CONTENT { canvas: orchestration_canvas:once_b, name: "sub", comment: "", spec: { type: "canvas_import", config: { canvas: orchestration_canvas:once_sub } }, position: { x: 0, y: 0 } };
"""
allow = false
error_contains = "orchestration_node_import"

[[cases]]
name = "a_canvas_cannot_import_itself"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:selfish CONTENT { name: "c", description: "" };
CREATE orchestration_node:selfish CONTENT { canvas: orchestration_canvas:selfish, name: "me", comment: "", spec: { type: "canvas_import", config: { canvas: orchestration_canvas:selfish } }, position: { x: 0, y: 0 } };
"""
allow = false
error_contains = "spec.config.canvas"

# Root, ancestors and tree are computed from the import nodes alone; the THROW
# guards make the case fail on any wrong answer.
[[cases]]
name = "tree_functions_walk_import_nodes"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:walk_root CONTENT { name: "root", description: "" };
CREATE orchestration_canvas:walk_sub CONTENT { name: "sub", description: "" };
CREATE orchestration_canvas:walk_subsub CONTENT { name: "subsub", description: "" };
CREATE orchestration_node:walk_1 CONTENT { canvas: orchestration_canvas:walk_root, name: "sub", comment: "", spec: { type: "canvas_import", config: { canvas: orchestration_canvas:walk_sub } }, position: { x: 0, y: 0 } };
CREATE orchestration_node:walk_2 CONTENT { canvas: orchestration_canvas:walk_sub, name: "subsub", comment: "", spec: { type: "canvas_import", config: { canvas: orchestration_canvas:walk_subsub } }, position: { x: 0, y: 0 } };
IF fn::orchestration_root(orchestration_canvas:walk_subsub) != orchestration_canvas:walk_root { THROW "root" };
IF fn::orchestration_root(orchestration_canvas:walk_root) != orchestration_canvas:walk_root { THROW "root of root" };
IF fn::orchestration_ancestors(orchestration_canvas:walk_subsub, 0) != [orchestration_canvas:walk_sub, orchestration_canvas:walk_root] { THROW "ancestors" };
IF fn::orchestration_tree(orchestration_canvas:walk_root, 0) != [orchestration_canvas:walk_root, orchestration_canvas:walk_sub, orchestration_canvas:walk_subsub] { THROW "tree" };
fn::orchestration_touch(orchestration_canvas:walk_subsub);
IF (SELECT VALUE generation FROM ONLY orchestration_canvas:walk_root) != 1 { THROW "touch root" };
IF (SELECT VALUE generation FROM ONLY orchestration_canvas:walk_subsub) != 0 { THROW "touch subsub" };
"""
allow = true

# Only a pod spec carries an `ip` key; an Entry, Exit or Relay node must stay
# insertable with no `ip` at all, which is why `spec.config.ip` is optional and
# the assertion tolerates NONE.
[[cases]]
name = "non_pod_node_needs_no_ip"
kind = "sql_expect"
actor = "root"
sql = """
CREATE orchestration_canvas:no_ip CONTENT { name: "c", description: "" };
CREATE orchestration_node:no_ip CONTENT { canvas: orchestration_canvas:no_ip, name: "entry", comment: "", spec: { type: "entry", config: { receive_proxy_protocol: NONE, tls: NONE } }, position: { x: 0, y: 0 } };
"""
allow = true

# The periodic-job claim: both timestamps are mandatory, because the
# compare-and-set reads `last_signal_tick` in its `WHERE` clause. A row missing
# it would be claimable by every delivery.
[[cases]]
name = "job_run_records_both_timestamps"
kind = "schema_metadata"
sql = "INFO FOR TABLE orchestration_job_run;"
contains = [
    "DEFINE FIELD last_run_at ON orchestration_job_run TYPE datetime",
    "DEFINE FIELD last_signal_tick ON orchestration_job_run TYPE datetime",
]

# The claim is the whole at-most-once guarantee, so exercise the statement the
# hooks run: the first tick claims, the same tick never claims again, a tick
# inside the interval is refused, and one a full interval later claims.
[[cases]]
name = "a_job_run_is_claimed_once_per_tick_and_interval"
kind = "sql_expect"
actor = "root"
sql = """
LET $first = (CREATE orchestration_job_run:suite CONTENT {
    last_run_at: d"2026-01-01T00:00:00Z", last_signal_tick: d"2026-01-01T00:00:00Z"
} RETURN AFTER);
-- The same tick, refused by `last_signal_tick < $tick`.
LET $same = (UPDATE orchestration_job_run:suite
    SET last_run_at = time::now(), last_signal_tick = d"2026-01-01T00:00:00Z"
    WHERE last_signal_tick < d"2026-01-01T00:00:00Z"
      AND last_signal_tick <= d"2026-01-01T00:00:00Z" RETURN AFTER);
-- A newer tick 5s later with a 30s interval: refused by the interval fence.
LET $early = (UPDATE orchestration_job_run:suite
    SET last_run_at = time::now(), last_signal_tick = d"2026-01-01T00:00:05Z"
    WHERE last_signal_tick < d"2026-01-01T00:00:05Z"
      AND last_signal_tick <= d"2025-12-31T23:59:35Z" RETURN AFTER);
-- A tick a full interval later: claimed.
LET $due = (UPDATE orchestration_job_run:suite
    SET last_run_at = time::now(), last_signal_tick = d"2026-01-01T00:00:30Z"
    WHERE last_signal_tick < d"2026-01-01T00:00:30Z"
      AND last_signal_tick <= d"2026-01-01T00:00:00Z" RETURN AFTER);
IF array::len($same) != 0 { THROW "a replayed tick claimed the run" };
IF array::len($early) != 0 { THROW "a tick inside the interval claimed the run" };
IF array::len($due) != 1 { THROW "a tick a full interval later was refused" };
IF (SELECT VALUE last_signal_tick FROM ONLY orchestration_job_run:suite) != d"2026-01-01T00:00:30Z" {
    THROW "the claimed tick was not recorded"
};
RETURN "ok";
"""
allow = true
