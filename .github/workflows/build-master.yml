name: Build Master Image

# Images are cut from tags only: `master-v0.1.0`, `master-v0.1.0-alpha`, ...
# Branch pushes never publish.
on:
  push:
    tags:
      - "master-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-master-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/guru-master

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#master-}"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          # `latest` only moves for final releases, never for pre-releases
          # (`-alpha`, `-rc.1`, ...).
          if [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest=true" >>"$GITHUB_OUTPUT"
          else
            echo "latest=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./master.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=master
          cache-to: type=gha,mode=max,scope=master
