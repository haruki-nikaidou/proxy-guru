[package]
name = "guru-master"
version = "0.3.0-beta"  # master side
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Internal
auth = { path = "../../modules/auth" }
base = { path = "../../modules/base" }
orchestration = { path = "../../modules/orchestration" }
reqwest = { workspace = true }
rpguru_sdk = { path = "../../lib/rpguru_sdk" }

# Runtime
tokio = { workspace = true }

# Framework
wakuwaku = { workspace = true }
kanau = { workspace = true }

# Workers: gRPC / REST / AMQP
tonic = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
amqprs = { workspace = true }
# The live dashboard bus: pub/sub between master replicas.
redis = { workspace = true }

# Shared dependencies
surrealdb = { workspace = true }
# The scheduler's clock: `IntervalJob::publish` takes a `time::OffsetDateTime`.
time = { workspace = true }
# Built together with `guru-worker` (ring for QUIC) this binary carries two rustls
# providers; `instant-acme` panics unless one is installed process-wide (see main).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

# CLI
clap = { workspace = true }

# Configuration
serde = { workspace = true }
serde_json = { workspace = true }

# Streaming
tokio-util = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
