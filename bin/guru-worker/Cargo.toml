[package]
name = "guru-worker"
version = "0.4.0-beta"  # worker side
edition = "2024"

[lib]
name = "guru_worker"
path = "src/lib.rs"

[[bin]]
name = "guru-worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
quinn = { version = "0.11", features = ["runtime-tokio"] }
# The congestion-control trait the brutal sender implements (`quinn` does not
# re-export `RttEstimator`). Resolved to vendor/quinn-proto by the workspace patch.
quinn-proto = "0.11"
smallvec = { version = "1.15", features = ["serde"] }
compact_str = { version = "0.10", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["serde", "registry", "env-filter"] }
ppp = "2.3"
tokio-openssl = "0.6"
tokio-util = "0.7"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
# Address discovery for agent mode: interface enumeration and the public-ip
# lookup (rustls, the TLS stack tonic already links; no second one).
if-addrs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
# Dual-stack listeners: `::` must be bound with IPV6_V6ONLY off explicitly.
socket2 = "0.6"
moka = { version = "0.12", features = ["future"] }
guru_worker_config = { path = "../../lib/guru_worker_config" }
rpguru_sdk = { path = "../../lib/rpguru_sdk" }
tonic = { workspace = true, features = ["channel", "tls-ring", "tls-native-roots"] }
clap = { workspace = true }
serde_json = { workspace = true }
tokio-stream = { workspace = true }
parking_lot = "0.12"
# Self-update verifies the downloaded binary against the published digest.
sha2 = { workspace = true }

[dev-dependencies]
orchestration = { path = "../../modules/orchestration" }
auth = { path = "../../modules/auth" }
base = { path = "../../modules/base" }
wakuwaku = { workspace = true }
kanau = { workspace = true }
sqlx = { workspace = true }
tower = { workspace = true }
rcgen = { workspace = true }
chrono = { workspace = true }
