[package]
name = "guru-worker"
version = "0.0.2-alpha"  # worker side
edition = "2024"

[lib]
name = "guru_worker"
path = "src/lib.rs"

[[bin]]
name = "guru-worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
quinn = { version = "0.11", features = ["runtime-tokio"] }
smallvec = { version = "1.15", features = ["serde"] }
compact_str = { version = "0.10", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["serde", "registry", "env-filter"] }
ppp = "2.3"
tokio-openssl = "0.6"
tokio-util = "0.7"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
moka = { version = "0.12", features = ["future"] }
guru_worker_config = { path = "../../lib/guru_worker_config" }
rpguru_sdk = { path = "../../lib/rpguru_sdk" }
tonic = { workspace = true, features = ["channel"] }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
orchestration = { path = "../../modules/orchestration" }
auth = { path = "../../modules/auth" }
wakuwaku = { workspace = true }
kanau = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio-stream = { workspace = true, features = ["net"] }
tower = { workspace = true }
chrono = { workspace = true }
