syntax = "proto3";

package guru.orchestration;

import "base/config.proto";

// Optional values are encoded uniformly: a `*_UNSPECIFIED` enum value, an unset
// message field, an empty `string` and a `0` `uint32` all mean "none".

enum ProxyProtocolVersion {
  PROXY_PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROXY_V1 = 1;
  PROXY_V2 = 2;
}
// How a server sends on its QUIC relay links.
enum QuicCongestion {
  QUIC_CONGESTION_UNSPECIFIED = 0;
  QUIC_CUBIC = 1;
  QUIC_BRUTAL = 2;
}
// A server's side of every QUIC relay link it takes part in. `up_mbps` is what
// it sends at (brutal's fixed rate), `down_mbps` what it can receive; on each
// link the master pairs a server's numbers with its peer's, so nobody sends
// faster than the other end said it can take. Zero means unknown / default.
message QuicSettings {
  QuicCongestion congestion = 1;
  uint32 up_mbps = 2;
  uint32 down_mbps = 3;
  // Bytes; 0 derives the per-stream window from down_mbps.
  uint64 stream_receive_window = 4;
  // Bytes; 0 leaves the whole-connection window unlimited.
  uint64 conn_receive_window = 5;
}
enum RelayProtocol {
  RELAY_PROTOCOL_UNSPECIFIED = 0;
  RELAY_TCP_RAW = 1;
  RELAY_TCP_TLS = 2;
  RELAY_QUIC = 3;
}
enum LoadBalanceMode {
  LOAD_BALANCE_MODE_UNSPECIFIED = 0;
  ROUND_ROBIN = 1;
  RANDOM = 2;
  IP_HASH = 3;
  FALLBACK = 4;
}
enum Ipv6Resolve {
  IPV6_RESOLVE_UNSPECIFIED = 0;
  IPV6_REQUIRED = 1;
  IPV6_PREFERRED = 2;
  IPV6_TOLERATED = 3;
  IPV6_FORBIDDEN = 4;
}
enum PortKind {
  PORT_KIND_UNSPECIFIED = 0;
  DERIVE_LISTEN = 1;
  DERIVE_DESTINATION = 2;
  // A bundle carries every channel of a universal node to the next one; it is
  // expansion metadata, not a traffic port.
  BUNDLE = 3;
}
enum PortDirection {
  PORT_DIRECTION_UNSPECIFIED = 0;
  PORT_INPUT = 1;
  PORT_OUTPUT = 2;
}
enum CanvasExportAs {
  CANVAS_EXPORT_AS_UNSPECIFIED = 0;
  INPUT_INTO_CANVAS = 1;
  OUTPUT_OUT_OF_CANVAS = 2;
}
enum ProblemSeverity {
  PROBLEM_SEVERITY_UNSPECIFIED = 0;
  PROBLEM_ERROR = 1;
  PROBLEM_WARNING = 2;
}
enum ProblemKind {
  PROBLEM_KIND_UNSPECIFIED = 0;
  PORT_KIND_MISMATCH = 1;
  EDGE_DIRECTION_INVALID = 2;
  EDGE_SELF_NODE = 3;
  EDGE_CROSS_CANVAS = 4;
  PORT_OVERSUBSCRIBED = 5;
  PORT_SHAPE_INVALID = 6;
  CYCLE = 7;
  DUPLICATE_LISTEN = 8;
  reserved 9; // POD_IP_FOREIGN: pods are attributed to a server directly now
  EXIT_DESTINATION_INVALID = 10;
  IP_HASH_WITHOUT_CLIENT_IP = 11;
  reserved 12; // UNSUPPORTED_SPEC: import/export nodes are supported since stage 2
  POD_PORT_UNCONNECTED = 13;
  RELAY_SAME_SERVER = 14;
  DISTRIBUTE_SINGLE_MEMBER = 15;
  CANVAS_IMPORT_SELF = 16;
  CANVAS_IMPORT_ANCESTOR = 17;
  CANVAS_IMPORT_DUPLICATE = 18;
  CANVAS_IMPORT_UNRESOLVED = 19;
  POD_SERVER_FOREIGN = 20;
  SERVER_NO_ADDRESS = 21;
  CHANNEL_TARGET_NOT_POD = 22;
  BUNDLE_EDGE_INVALID = 23;
  BUNDLE_CYCLE = 24;
  CHANNEL_NO_EXIT = 25;
  CHANNEL_NO_TRANSIT = 26;
  LANES_STALE = 27;
}
// The role a lane node plays in the expansion of a universal node.
enum LaneRole {
  LANE_ROLE_UNSPECIFIED = 0;
  LANE_DISTRIBUTE = 1;
  LANE_RELAY = 2;
  LANE_LANDING = 3;
  LANE_AGGREGATE = 4;
}
// The handle groups of a bundle-capable node, for connects that create a port
// on demand: `CHANNEL_OUT` on a load-balance distribute node or a universal pod
// (one port per channel), `BUNDLE_IN` on a universal pod or a load-balance
// distribute node (one port per incoming bundle). Bundles leave through ports
// that already exist (a distribute node's members, a universal pod's
// `bundle_out`) and enter an aggregate node through its members, so those
// ends are given by port id.
enum UniversalGroup {
  UNIVERSAL_GROUP_UNSPECIFIED = 0;
  CHANNEL_OUT = 1;
  BUNDLE_IN = 2;
  reserved 3; // BUNDLE_OUT: bundles now leave through member ports
}
enum ServerHealthStatus {
  SERVER_HEALTH_STATUS_UNSPECIFIED = 0;
  SERVER_ONLINE = 1;
  SERVER_DEGRADED = 2;
  SERVER_OFFLINE = 3;
}
enum NodeHealthStatus {
  NODE_HEALTH_STATUS_UNSPECIFIED = 0;
  NODE_READY = 1;
  NODE_DEPLOYING = 2;
  NODE_FAILED = 3;
}
enum DnsProviderKind {
  DNS_PROVIDER_KIND_UNSPECIFIED = 0;
  DNS_CLOUDFLARE = 1;
  DNS_VERCEL = 2;
}
enum CertificateStatus {
  CERTIFICATE_STATUS_UNSPECIFIED = 0;
  CERTIFICATE_PENDING = 1;
  CERTIFICATE_ISSUED = 2;
  CERTIFICATE_FAILED = 3;
}

message CanvasUiPosition {
  int64 x = 1;
  int64 y = 2;
}
message TlsConfig {
  string sni = 1;
  string dns_provider_id = 2;
  string domain_id = 3;
  string acme_directory = 4;
}
// One listener on one server. `bind_ip` empty means every address of the host
// (dual-stack `::`); `advertise_ip` empty means the server's effective address.
message PodConfig {
  reserved 1; // ip_record_id
  uint32 port = 2;
  string server_id = 3;
  string bind_ip = 4;
  string advertise_ip = 5;
}
message EntryConfig {
  ProxyProtocolVersion receive_proxy_protocol = 1;
  TlsConfig tls = 2;
}
message RelayConfig {
  RelayProtocol protocol = 1;
  string override_ip_address = 2;
  uint32 override_port = 3;
}
message ExitConfig {
  string destination = 1;
  ProxyProtocolVersion pass_proxy_protocol = 2;
}
// One member of a load-balance node, as the operator declares it: `slot` is the
// member's stable number (its port is `member_<slot>`, so renaming keeps the
// bundle drawn on it), `name` is what the operator calls it.
message LoadBalanceMember {
  uint32 slot = 1;
  string name = 2;
}
// The operator's rule: `members` are the bundles this node splits into, one
// port each, in the order given (1 to 256, unique names and slots).
// `protocol` is how the channels bundled out are relayed to the universal
// pods they land on (unspecified = raw TCP).
message LoadBalanceDistributeConfig {
  LoadBalanceMode mode = 1;
  RelayProtocol protocol = 2;
  repeated LoadBalanceMember members = 3;
}
// `members` are the bundles this node joins, one port each (1 to 256).
message LoadBalanceAggregateConfig {
  repeated LoadBalanceMember members = 1;
}
message CanvasImportConfig {
  string canvas_id = 1;
}
message CanvasExportConfig {
  PortKind kind = 1;
  CanvasExportAs direction = 2;
}
// The universal pod of a server: created with the server, one per server. It
// takes bundles in and lands every channel they carry on a real pod of its own
// (a "lane"), then hands the bundle on through `bundle_out`. Bundles start at a
// load-balance distribute node (one per entry pod connected to its channel
// handle) and end at a load-balance aggregate node, which grows one input per
// channel for an exit; both are ordinary load-balance nodes whose ports adapt.
message UniversalPodConfig {
  string server_id = 1;
}
message NodeSpec {
  oneof spec {
    PodConfig pod = 1;
    EntryConfig entry = 2;
    RelayConfig relay = 3;
    ExitConfig exit = 4;
    LoadBalanceDistributeConfig load_balance_distribute = 5;
    LoadBalanceAggregateConfig load_balance_aggregate = 6;
    CanvasImportConfig canvas_import = 7;
    CanvasExportConfig canvas_export = 8;
    UniversalPodConfig universal_pod = 9;
  }
  reserved 10, 11; // universal_distribute / universal_aggregate: folded into load balance nodes
}
// Why a node exists: it was generated by the expansion of a universal node
// (`group_node_id`) for one channel (`channel_pod_id`, the entry pod the
// channel starts at). Such a node is managed: it cannot be retired or
// re-wired by hand, only a landing pod's port may be edited.
message Lane {
  string key = 1;
  string group_node_id = 2;
  string channel_pod_id = 3;
  LaneRole role = 4;
  // The universal node the bundle came from (a landing pod) or the universal
  // pod a relay dials (a distributor's relay); empty otherwise.
  string source_node_id = 5;
}

message Port {
  string id = 1;
  string node_id = 2;
  PortKind kind = 3;
  PortDirection direction = 4;
  string key = 5;
  int64 position = 6;
}
message Node {
  string id = 1;
  string canvas_id = 2;
  string name = 3;
  string comment = 4;
  NodeSpec spec = 5;
  CanvasUiPosition position = 6;
  repeated Port ports = 7;
  // Set only for a canvas_import node: the canvas it embeds. An import node's
  // ports mirror that canvas's export nodes (port key = export node id).
  Canvas import_target = 8;
  // Set only for a node generated by a universal node's expansion.
  Lane lane = 9;
}
message Edge {
  string id = 1;
  string source_port_id = 2;
  string target_port_id = 3;
}
// One of the two fixed address slots of a server (IPv4, IPv6): what the worker
// reported and what the operator typed over it. Empty strings mean unset.
message AddressSlot {
  string reported = 1;
  string pinned = 2;
}
enum AddressSource {
  ADDRESS_SOURCE_UNSPECIFIED = 0;
  ADDRESS_OVERRIDE = 1;
  ADDRESS_REPORTED = 2;
  ADDRESS_OBSERVED = 3;
}
// Where a server can be reached. `effective_address` is what other servers
// dial by default: v4 override, else reported v4, else the address the master
// observed on registration, else the v6 slot.
message ServerAddresses {
  AddressSlot v4 = 1;
  AddressSlot v6 = 2;
  // Operator-added extra addresses (a second public IP, an overlay address).
  repeated string extra = 3;
  repeated string reported_interfaces = 4;
  string reported_at = 5;
  string observed_address = 6;
  string observed_at = 7;
  string effective_address = 8;
  AddressSource effective_source = 9;
  // ISO 3166-1 alpha-2 country of the server's IPv4 address (the first IPv4 of
  // the pinned, reported, observed chain), as the master looked it up; empty
  // until a lookup for that address succeeded.
  string country = 10;
}
message Server {
  string id = 1;
  string canvas_id = 2;
  string name = 3;
  string icon = 4;
  string comment = 5;
  CanvasUiPosition position = 6;
  Ipv6Resolve ipv6_resolve = 7;
  string log_level = 8;
  string last_seen_at = 9;
  QuicSettings quic = 20;
  ServerHealthStatus health_status = 11;
  reserved 10; // ips
  ServerAddresses addresses = 12;
  // What the worker last registered as: its crate version and the CPU
  // architecture it was built for. Empty until a worker that reports them
  // registers.
  string agent_version = 13;
  string agent_arch = 14;
  // The systemd instance the install command creates: `guru-worker@<unit>`.
  string agent_unit = 15;
  // A pending self-update: the version the operator asked the worker to move
  // to. Empty once the worker registers as that version, or after a failure.
  string agent_update_requested = 16;
  // Why the last self-update failed, as the worker reported it.
  string agent_update_error = 17;
  // When the server's own agent key was issued; empty when it has none.
  string agent_key_issued_at = 18;
  // When the worker's last health report was accepted; empty until one is.
  // `last_seen_at` also moves with the config stream's heartbeat, which the
  // master keeps up on its own timer, so this is what "online" is judged on.
  string last_health_report_at = 19;
}
message Canvas {
  string id = 1;
  string name = 2;
  string description = 3;
}
message Problem {
  ProblemSeverity severity = 1;
  ProblemKind kind = 2;
  string message = 3;
  repeated string node_ids = 4;
  repeated string edge_ids = 5;
  repeated string port_ids = 6;
}
// A listener a server serves, or that another server points at, identified by
// the server it lives on. `protocol` is one of `raw`, `relay_tcp`, `relay_tls`,
// `relay_quic`.
message ListenerCap {
  reserved 1; // ip
  uint32 port = 2;
  string protocol = 3;
  string server_id = 4;
}
message ForwardingDeps {
  ListenerCap serves = 1;
  repeated ListenerCap points_at = 2;
}
message ConfigSnapshot {
  int64 revision = 1;
  string created_at = 2;
  repeated ForwardingDeps forwardings = 3;
}

message CreateCanvasRequest {
  string name = 1;
  string description = 2;
}
message CreateCanvasReply {
  Canvas canvas = 1;
}
message ListCanvasesRequest {
  // Subcanvases (canvases imported by another canvas) are omitted unless set.
  bool include_subcanvases = 1;
}
message ListCanvasesReply {
  repeated Canvas canvases = 1;
}
message GetCanvasRequest {
  string canvas_id = 1;
}
message GetCanvasReply {
  Canvas canvas = 1;
  repeated Server servers = 2;
  repeated Node nodes = 3;
  repeated Edge edges = 4;
  // Root first, parent last; empty for a root canvas.
  repeated Canvas ancestors = 5;
}
// Any canvas of the tree may be given; the reply is always the whole tree.
message GetCanvasTreeRequest {
  string canvas_id = 1;
}
message CanvasTreeNode {
  Canvas canvas = 1;
  repeated CanvasTreeNode children = 2;
}
message GetCanvasTreeReply {
  CanvasTreeNode root = 1;
}
message UpdateCanvasRequest {
  string canvas_id = 1;
  string name = 2;
  string description = 3;
}
message UpdateCanvasReply {
  Canvas canvas = 1;
}
message DeleteCanvasRequest {
  string canvas_id = 1;
}
message DeleteCanvasReply {}
message ValidateCanvasRequest {
  string canvas_id = 1;
}
message ValidateCanvasReply {
  repeated Problem problems = 1;
}

message CreateServerRequest {
  string canvas_id = 1;
  string name = 2;
  string icon = 3;
  string comment = 4;
  CanvasUiPosition position = 5;
  Ipv6Resolve ipv6_resolve = 6;
  string log_level = 7;
  // Empty strings clear the slot.
  string override_v4 = 8;
  string override_v6 = 9;
  repeated string extra_addresses = 10;
}
message CreateServerReply {
  Server server = 1;
}
message UpdateServerRequest {
  string server_id = 1;
  string name = 2;
  string icon = 3;
  string comment = 4;
  Ipv6Resolve ipv6_resolve = 5;
  string log_level = 6;
  // Empty strings clear the slot; `extra_addresses` replaces the whole list.
  string override_v4 = 7;
  string override_v6 = 8;
  repeated string extra_addresses = 9;
  // The systemd instance the install command targets (`guru-worker@<unit>`):
  // 1-32 lowercase letters, digits or dashes. Empty clears it.
  string agent_unit = 10;
  // Absent keeps quinn's defaults (every field zero).
  QuicSettings quic = 11;
}
message UpdateServerReply {
  Server server = 1;
}
// Issues the server's own agent key and renders the install command carrying
// it. The key appears exactly once, inside `command`; issuing again replaces
// it, so a worker still holding the previous key is refused at its next
// registration. `unit` empty keeps the stored instance name, or derives one
// from the server name. Maintainer+.
message IssueServerAgentInstallRequest {
  string server_id = 1;
  string unit = 2;
}
message IssueServerAgentInstallReply {
  string command = 1;
  string unit = 2;
  string version = 3;
  Server server = 4;
}
// The published worker release (`manage-tool agent publish`): empty `version`
// means none yet. `base_url_configured` is whether the install command has an
// origin to download from at all.
message GetAgentReleaseRequest {}
message GetAgentReleaseReply {
  string version = 1;
  string sha256 = 2;
  string arch = 3;
  string published_at = 4;
  bool base_url_configured = 5;
}
// Asks the server's worker to move to the published release: it picks the
// request up at its next poll, downloads and verifies the binary, swaps it in
// and restarts. `agent_update_requested` clears once the worker registers as
// that version, or with `agent_update_error` set when the attempt failed.
message RequestAgentUpdateRequest {
  string server_id = 1;
}
message RequestAgentUpdateReply {
  Server server = 1;
}
message DeleteServerRequest {
  string server_id = 1;
}
message DeleteServerReply {}
message MoveServerRequest {
  string server_id = 1;
  CanvasUiPosition position = 2;
}
message MoveServerReply {}

message CreateNodeRequest {
  string canvas_id = 1;
  string name = 2;
  string comment = 3;
  NodeSpec spec = 4;
  CanvasUiPosition position = 5;
  // Reserved for specs with a hand-drawn member count; load-balance nodes
  // declare their members in the spec and take 0 here.
  uint32 item_count = 6;
}
message CreateNodeReply {
  Node node = 1;
}
message ReplaceNodeSpecRequest {
  string node_id = 1;
  NodeSpec spec = 2;
  uint32 item_count = 3;
}
message ReplaceNodeSpecReply {
  Node node = 1;
}
message UpdateNodeMetaRequest {
  string node_id = 1;
  string name = 2;
  string comment = 3;
  CanvasUiPosition position = 4;
}
message UpdateNodeMetaReply {
  Node node = 1;
}
message RetireNodeRequest {
  string node_id = 1;
}
message RetireNodeReply {}
message ForceDeleteNodeRequest {
  string node_id = 1;
}
message ForceDeleteNodeReply {}

// One end of a connect on a universal node's handle group instead of a port: the
// port is created on demand (a distributor's `chan:<pod>`, a bundle port) and
// the node's lanes are regenerated in the same transaction.
message UniversalHandle {
  string node_id = 1;
  UniversalGroup group = 2;
}
// Each end is either a port id or a universal handle; the handle is used when
// the port id is empty.
message ConnectRequest {
  string output_port_id = 1;
  string input_port_id = 2;
  UniversalHandle output_handle = 3;
  UniversalHandle input_handle = 4;
}
message ConnectReply {
  Edge edge = 1;
}
message DisconnectRequest {
  string edge_id = 1;
}
message DisconnectReply {}
message ForceDisconnectRequest {
  string edge_id = 1;
}
message ForceDisconnectReply {}

message GetServerConfigRequest {
  string server_id = 1;
}
message GetServerConfigReply {
  int64 revision = 1;
  string toml = 2;
}
message GetServerRolloutStatusRequest {
  string server_id = 1;
}
// One pod that failed to derive on its own. `listen` is the `bind:port` it would
// have served (`[::]:port` for a wildcard bind), `error` the rendered derivation
// error.
message InvalidPod {
  string node_id = 1;
  string pod_name = 2;
  string listen = 3;
  string error = 4;
}
// `waiting_for_server_ids` are servers whose applied config does not yet serve a
// listener this server's ideal config points at.
//
// `derive_error` is a whole-server derivation failure: nothing was published for
// this server at all. `invalid_pods` is the per-pod counterpart: only those pods
// failed, the rest of the server's config was derived and published normally,
// and each listed pod keeps whatever listener shape it was already serving. A
// server-level failure leaves `invalid_pods` empty.
message GetServerRolloutStatusReply {
  ConfigSnapshot desired = 1;
  ConfigSnapshot in_flight = 2;
  ConfigSnapshot applied = 3;
  string apply_error = 4;
  string derive_error = 5;
  repeated string waiting_for_server_ids = 6;
  bool derivation_pending = 7;
  string last_seen_at = 8;
  repeated InvalidPod invalid_pods = 9;
}
// Admin only: declares a server dead, which lets its dependants switch away from
// listeners it may in fact still be serving.
message ForgetServerAppliedRequest {
  string server_id = 1;
}
message ForgetServerAppliedReply {}

message ServerHealthRecord {
  string id = 1;
  string server_id = 2;
  ServerHealthStatus status = 3;
  string report_time = 4;
  int64 upload_bytes = 5;
  int64 download_bytes = 6;
  int64 current_connections = 7;
  int64 max_connections = 8;
}
message NodeHealthRecord {
  string id = 1;
  string node_id = 2;
  NodeHealthStatus status = 3;
  string message = 4;
  string report_time = 5;
}
// `start` / `end` are RFC 3339; an empty `end` means now, an empty `start`
// means one hour before `end`.
message ListServerHealthHistoryRequest {
  string server_id = 1;
  string start = 2;
  string end = 3;
}
message ListServerHealthHistoryReply {
  repeated ServerHealthRecord records = 1;
}
// `limit` of 0 means the server default; records come newest first.
message ListNodeHealthHistoryRequest {
  string node_id = 1;
  string start = 2;
  string end = 3;
  uint32 limit = 4;
}
message ListNodeHealthHistoryReply {
  repeated NodeHealthRecord records = 1;
}

// DNS providers are Admin only. `api_secret` is write-only: it is never
// returned.
message DnsProvider {
  string id = 1;
  string name = 2;
  DnsProviderKind provider = 3;
  // Cloudflare: unused (the zone id lives on the Entry's `TlsConfig.domain_id`).
  // Vercel: the team id, or empty for a personal account.
  string account_id = 4;
  string created_at = 5;
}
message CreateDnsProviderRequest {
  string name = 1;
  DnsProviderKind provider = 2;
  string account_id = 3;
  string api_secret = 4;
}
message CreateDnsProviderReply {
  DnsProvider provider = 1;
}
message ListDnsProvidersRequest {}
message ListDnsProvidersReply {
  repeated DnsProvider providers = 1;
}
// An empty `api_secret` keeps the stored secret.
message UpdateDnsProviderRequest {
  string dns_provider_id = 1;
  string name = 2;
  string account_id = 3;
  string api_secret = 4;
}
message UpdateDnsProviderReply {
  DnsProvider provider = 1;
}
// Refused while an Entry still references the provider.
message DeleteDnsProviderRequest {
  string dns_provider_id = 1;
}
message DeleteDnsProviderReply {}

// One ACME certificate, identified by `(sni, acme_directory)`. Key material is
// never returned.
message Certificate {
  string id = 1;
  string sni = 2;
  string dns_provider_id = 3;
  string domain_id = 4;
  string acme_directory = 5;
  CertificateStatus status = 6;
  string not_before = 7;
  string not_after = 8;
  string last_error = 9;
  string last_attempt_at = 10;
}
message ListCertificatesRequest {}
message ListCertificatesReply {
  repeated Certificate certificates = 1;
}
// Admin only: clears a failure (or forces a renewal of an issued one) so the
// next renewal pass retries it.
message RetryCertificateRequest {
  string certificate_id = 1;
}
message RetryCertificateReply {
  Certificate certificate = 1;
}
// Admin only. Refused while an Entry still references the certificate's
// `(sni, acme_directory)`.
message DeleteCertificateRequest {
  string certificate_id = 1;
}
message DeleteCertificateReply {}

// The `orchestration` configuration document
// (`orchestration::config::OrchestrationConfig`). Admin only: these values size
// every health threshold, retention window and certificate lifetime in the
// fleet.
message GetOrchestrationConfigRequest {}
message GetOrchestrationConfigReply {
  guru.base.ConfigDocument config = 1;
}
// `json` replaces the whole document. It is decoded into `OrchestrationConfig`
// first, so a payload of the wrong shape is rejected and the row keeps its
// previous contents. Masters pick the new values up on restart.
message SetOrchestrationConfigRequest {
  string json = 1;
}
message SetOrchestrationConfigReply {
  guru.base.ConfigDocument config = 1;
}

// ---- live streams -----------------------------------------------------------
// Every Watch* stream opens with a snapshot and then sends a new message per
// change; an empty KeepAlive is sent every `stream_keepalive_secs`. Streams need
// a human session and end with UNAUTHENTICATED once that session is gone, and
// with NOT_FOUND if the watched record disappears. The server never asks the
// client to re-request: a slow consumer receives fewer, newer snapshots.
message KeepAlive {}

enum CanvasChangeKind {
  CANVAS_CHANGE_KIND_UNSPECIFIED = 0; // the opening snapshot, or a refresh after a bus reconnect
  CANVAS_UPDATED = 1;
  CANVAS_DELETED = 2;
  SERVER_CREATED = 3;
  SERVER_UPDATED = 4;
  SERVER_MOVED = 5;
  SERVER_DELETED = 6;
  SERVER_IP_CHANGED = 7;
  NODE_CREATED = 8;
  NODE_REPLACED = 9;
  NODE_META_UPDATED = 10;
  NODE_RETIRED = 11;
  NODE_DELETED = 12;
  EDGE_CONNECTED = 13;
  EDGE_RETIRED = 14;
  EDGE_DELETED = 15;
  SERVER_HEALTH_CHANGED = 16;
}
message WatchCanvasRequest {
  string canvas_id = 1;
}
// The whole GetCanvas reply again. `generation` is the root canvas's edit counter
// and is informational only: metadata edits (positions, names) do not bump it.
// Several changes may collapse into one snapshot; `cause` is then the latest.
message CanvasSnapshot {
  int64 generation = 1;
  CanvasChangeKind cause = 2;
  repeated string affected_ids = 3;
  GetCanvasReply contents = 4;
}
message CanvasEvent {
  oneof event {
    CanvasSnapshot snapshot = 1;
    KeepAlive keep_alive = 2;
  }
}
// `since` is RFC 3339; empty means one hour ago.
message WatchServerHealthRequest {
  string server_id = 1;
  string since = 2;
}
message ServerHealthSnapshot {
  ServerHealthStatus status = 1;
  string last_seen_at = 2;
  repeated ServerHealthRecord records = 3; // oldest first
}
message ServerHealthEvent {
  oneof event {
    ServerHealthSnapshot snapshot = 1;
    ServerHealthRecord record = 2;
    KeepAlive keep_alive = 3;
  }
}
// `limit` bounds the opening snapshot; 0 means 50.
message WatchNodeHealthRequest {
  string node_id = 1;
  uint32 limit = 2;
}
message NodeHealthSnapshot {
  NodeHealthStatus status = 1; // the newest record's status; UNSPECIFIED when there is none
  repeated NodeHealthRecord records = 2; // newest first
}
message NodeHealthEvent {
  oneof event {
    NodeHealthSnapshot snapshot = 1;
    NodeHealthRecord record = 2;
    KeepAlive keep_alive = 3;
  }
}
// Any canvas of a tree may be given; the snapshot covers every server of the tree.
message WatchRolloutsRequest {
  string canvas_id = 1;
}
message ServerRollout {
  string server_id = 1;
  string canvas_id = 2;
  GetServerRolloutStatusReply status = 3;
}
message RolloutSnapshot {
  repeated ServerRollout servers = 1;
}
message RolloutEvent {
  oneof event {
    RolloutSnapshot snapshot = 1;
    KeepAlive keep_alive = 2;
  }
}

service Orchestration {
  rpc CreateCanvas(CreateCanvasRequest) returns (CreateCanvasReply);
  rpc ListCanvases(ListCanvasesRequest) returns (ListCanvasesReply);
  rpc GetCanvas(GetCanvasRequest) returns (GetCanvasReply);
  rpc UpdateCanvas(UpdateCanvasRequest) returns (UpdateCanvasReply);
  rpc DeleteCanvas(DeleteCanvasRequest) returns (DeleteCanvasReply);
  rpc ValidateCanvas(ValidateCanvasRequest) returns (ValidateCanvasReply);
  rpc GetCanvasTree(GetCanvasTreeRequest) returns (GetCanvasTreeReply);
  rpc CreateServer(CreateServerRequest) returns (CreateServerReply);
  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerReply);
  rpc DeleteServer(DeleteServerRequest) returns (DeleteServerReply);
  rpc MoveServer(MoveServerRequest) returns (MoveServerReply);
  rpc CreateNode(CreateNodeRequest) returns (CreateNodeReply);
  rpc ReplaceNodeSpec(ReplaceNodeSpecRequest) returns (ReplaceNodeSpecReply);
  rpc UpdateNodeMeta(UpdateNodeMetaRequest) returns (UpdateNodeMetaReply);
  rpc RetireNode(RetireNodeRequest) returns (RetireNodeReply);
  rpc ForceDeleteNode(ForceDeleteNodeRequest) returns (ForceDeleteNodeReply);
  // `ConnectPorts`, not `Connect`: the generated client already has a `connect`
  // constructor.
  rpc ConnectPorts(ConnectRequest) returns (ConnectReply);
  rpc Disconnect(DisconnectRequest) returns (DisconnectReply);
  rpc ForceDisconnect(ForceDisconnectRequest) returns (ForceDisconnectReply);
  rpc GetServerConfig(GetServerConfigRequest) returns (GetServerConfigReply);
  rpc GetServerRolloutStatus(GetServerRolloutStatusRequest) returns (GetServerRolloutStatusReply);
  rpc ForgetServerApplied(ForgetServerAppliedRequest) returns (ForgetServerAppliedReply);
  rpc IssueServerAgentInstall(IssueServerAgentInstallRequest) returns (IssueServerAgentInstallReply);
  rpc GetAgentRelease(GetAgentReleaseRequest) returns (GetAgentReleaseReply);
  rpc RequestAgentUpdate(RequestAgentUpdateRequest) returns (RequestAgentUpdateReply);
  rpc ListServerHealthHistory(ListServerHealthHistoryRequest) returns (ListServerHealthHistoryReply);
  rpc ListNodeHealthHistory(ListNodeHealthHistoryRequest) returns (ListNodeHealthHistoryReply);
  rpc WatchCanvas(WatchCanvasRequest) returns (stream CanvasEvent);
  rpc WatchServerHealth(WatchServerHealthRequest) returns (stream ServerHealthEvent);
  rpc WatchNodeHealth(WatchNodeHealthRequest) returns (stream NodeHealthEvent);
  rpc WatchRollouts(WatchRolloutsRequest) returns (stream RolloutEvent);
  rpc CreateDnsProvider(CreateDnsProviderRequest) returns (CreateDnsProviderReply);
  rpc ListDnsProviders(ListDnsProvidersRequest) returns (ListDnsProvidersReply);
  rpc UpdateDnsProvider(UpdateDnsProviderRequest) returns (UpdateDnsProviderReply);
  rpc DeleteDnsProvider(DeleteDnsProviderRequest) returns (DeleteDnsProviderReply);
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesReply);
  rpc RetryCertificate(RetryCertificateRequest) returns (RetryCertificateReply);
  rpc DeleteCertificate(DeleteCertificateRequest) returns (DeleteCertificateReply);
  rpc GetOrchestrationConfig(GetOrchestrationConfigRequest) returns (GetOrchestrationConfigReply);
  rpc SetOrchestrationConfig(SetOrchestrationConfigRequest) returns (SetOrchestrationConfigReply);
}
