syntax = "proto3";

package guru.orchestration;

import "base/config.proto";

// Optional values are encoded uniformly: a `*_UNSPECIFIED` enum value, an unset
// message field, an empty `string` and a `0` `uint32` all mean "none".

enum ProxyProtocolVersion {
  PROXY_PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROXY_V1 = 1;
  PROXY_V2 = 2;
}
// How a server sends on its QUIC relay links.
enum QuicCongestion {
  QUIC_CONGESTION_UNSPECIFIED = 0;
  QUIC_CUBIC = 1;
  QUIC_BRUTAL = 2;
}
// A server's side of every QUIC relay link it takes part in. `up_mbps` is what
// it sends at (brutal's fixed rate), `down_mbps` what it can receive; on each
// link the master pairs a server's numbers with its peer's, so nobody sends
// faster than the other end said it can take. Zero means unknown / default.
message QuicSettings {
  QuicCongestion congestion = 1;
  uint32 up_mbps = 2;
  uint32 down_mbps = 3;
  // Bytes; 0 derives the per-stream window from down_mbps.
  uint64 stream_receive_window = 4;
  // Bytes; 0 leaves the whole-connection window unlimited.
  uint64 conn_receive_window = 5;
}
enum Ipv6Resolve {
  IPV6_RESOLVE_UNSPECIFIED = 0;
  IPV6_REQUIRED = 1;
  IPV6_PREFERRED = 2;
  IPV6_TOLERATED = 3;
  IPV6_FORBIDDEN = 4;
}
enum ServerHealthStatus {
  SERVER_HEALTH_STATUS_UNSPECIFIED = 0;
  SERVER_ONLINE = 1;
  SERVER_DEGRADED = 2;
  SERVER_OFFLINE = 3;
}
enum PodHealthStatus {
  POD_HEALTH_STATUS_UNSPECIFIED = 0;
  POD_READY = 1;
  POD_DEPLOYING = 2;
  POD_FAILED = 3;
}
// How traffic arrives at a pod: clients connect to it directly (raw, or TLS
// terminated with an ACME certificate), or other pods relay to it in one
// protocol. An edge into a pod dials it in the protocol the pod listens with.
enum Ingress {
  INGRESS_UNSPECIFIED = 0;
  CLIENT_RAW = 1;
  CLIENT_TLS = 2;
  RELAY_TCP = 3;
  RELAY_TLS = 4;
  RELAY_QUIC = 5;
}
enum DnsProviderKind {
  DNS_PROVIDER_KIND_UNSPECIFIED = 0;
  DNS_CLOUDFLARE = 1;
  DNS_VERCEL = 2;
}
enum CertificateStatus {
  CERTIFICATE_STATUS_UNSPECIFIED = 0;
  CERTIFICATE_PENDING = 1;
  CERTIFICATE_ISSUED = 2;
  CERTIFICATE_FAILED = 3;
}

message CanvasUiPosition {
  int64 x = 1;
  int64 y = 2;
}
message TlsConfig {
  string sni = 1;
  string dns_provider_id = 2;
  string domain_id = 3;
  string acme_directory = 4;
}
// ---- the pod graph ------------------------------------------------------------
// A canvas tree's forwarding topology is a directed acyclic graph: pods are the
// vertices, exits the sinks, and every edge is a way a pod's traffic may go on.

// One listener on one server. `bind_ip` empty means every address of the host
// (dual-stack `::`); `advertise_ip` empty means the server's effective address.
message Pod {
  string id = 1;
  // The canvas the pod is drawn on; any canvas of its server's tree.
  string canvas_id = 2;
  string server_id = 3;
  string name = 4;
  string comment = 5;
  // On a write, 0 picks a free port of the server (40000-59999).
  uint32 port = 6;
  string bind_ip = 7;
  string advertise_ip = 8;
  Ingress ingress = 9;
  // Client ingress only.
  ProxyProtocolVersion receive_proxy_protocol = 10;
  // CLIENT_TLS only.
  TlsConfig tls = 11;
  // How the pod chooses between its out-edges, as the JSON document the pod row
  // stores; empty when it has none. A route names every out-edge exactly once:
  //   {"edge": "<edge id>"}
  //   {"balance": [{"weight": 2, "to": <route>}, {"to": <route>}], "sticky": "client_ip"}
  //   {"failover": [<route>, <route>]}
  string route_json = 12;
}
// A destination outside the fabric.
message Exit {
  string id = 1;
  string canvas_id = 2;
  string name = 3;
  string comment = 4;
  // `host:port`.
  string destination = 5;
  ProxyProtocolVersion send_proxy_protocol = 6;
  CanvasUiPosition position = 7;
}
// A pod's way on: to another pod, or to an exit. An edge's ends are its
// identity; its overrides say how the target pod is dialed.
message Edge {
  string id = 1;
  string source_pod_id = 2;
  oneof target {
    string target_pod_id = 3;
    string target_exit_id = 4;
  }
  // An IP literal or a host name; empty dials the target pod's address.
  string override_ip = 5;
  // 0 dials the target pod's port.
  uint32 override_port = 6;
}
message GroupMember {
  oneof member {
    string pod_id = 1;
    string edge_id = 2;
    string exit_id = 3;
    string server_id = 4;
  }
}
// How the dashboard draws part of the graph (a splitter, an aggregator, a
// rule): a kind it defines, and whatever it keeps about the drawing in
// `props_json`. Nothing is derived from a group.
message Group {
  string id = 1;
  string canvas_id = 2;
  string kind = 3;
  string name = 4;
  string props_json = 5;
  repeated GroupMember members = 6;
}
message GraphSubject {
  oneof subject {
    string server_id = 1;
    string pod_id = 2;
    string exit_id = 3;
    string edge_id = 4;
    string group_id = 5;
    string canvas_id = 6;
  }
}
// A problem with a graph, or with a change to it. `problem` is a stable
// snake_case name (`cycle`, `listener_conflict`, `route_missing_edge`,
// `listener_in_use`, `unknown_pod`, ...); an error blocks a write, a warning
// never does.
message Diagnostic {
  string problem = 1;
  bool error = 2;
  repeated GraphSubject subjects = 3;
  string message = 4;
}

// One of the two fixed address slots of a server (IPv4, IPv6): what the worker
// reported and what the operator typed over it. Empty strings mean unset.
message AddressSlot {
  string reported = 1;
  string pinned = 2;
}
enum AddressSource {
  ADDRESS_SOURCE_UNSPECIFIED = 0;
  ADDRESS_OVERRIDE = 1;
  ADDRESS_REPORTED = 2;
  ADDRESS_OBSERVED = 3;
}
// Where a server can be reached. `effective_address` is what other servers
// dial by default: v4 override, else reported v4, else the address the master
// observed on registration, else the v6 slot.
message ServerAddresses {
  AddressSlot v4 = 1;
  AddressSlot v6 = 2;
  // Operator-added extra addresses (a second public IP, an overlay address).
  repeated string extra = 3;
  repeated string reported_interfaces = 4;
  string reported_at = 5;
  string observed_address = 6;
  string observed_at = 7;
  string effective_address = 8;
  AddressSource effective_source = 9;
  // ISO 3166-1 alpha-2 country of the server's IPv4 address (the first IPv4 of
  // the pinned, reported, observed chain), as the master looked it up; empty
  // until a lookup for that address succeeded.
  string country = 10;
}
message Server {
  string id = 1;
  string canvas_id = 2;
  string name = 3;
  string icon = 4;
  string comment = 5;
  CanvasUiPosition position = 6;
  Ipv6Resolve ipv6_resolve = 7;
  string log_level = 8;
  string last_seen_at = 9;
  QuicSettings quic = 20;
  ServerHealthStatus health_status = 11;
  reserved 10; // ips
  ServerAddresses addresses = 12;
  // What the worker last registered as: its crate version and the CPU
  // architecture it was built for. Empty until a worker that reports them
  // registers.
  string agent_version = 13;
  string agent_arch = 14;
  // The systemd instance the install command creates: `guru-worker@<unit>`.
  string agent_unit = 15;
  // A pending self-update: the version the operator asked the worker to move
  // to. Empty once the worker registers as that version, or after a failure.
  string agent_update_requested = 16;
  // Why the last self-update failed, as the worker reported it.
  string agent_update_error = 17;
  // When the server's own agent key was issued; empty when it has none.
  string agent_key_issued_at = 18;
  // When the worker's last health report was accepted; empty until one is.
  // `last_seen_at` also moves with the config stream's heartbeat, which the
  // master keeps up on its own timer, so this is what "online" is judged on.
  string last_health_report_at = 19;
  // What the worker reads beyond the tree form every worker reads
  // (`route_table`, `relay_confirm`), as it last registered.
  repeated string capabilities = 21;
}
message Canvas {
  string id = 1;
  string name = 2;
  string description = 3;
  // The canvas this one is drawn inside; empty for a root.
  string parent_id = 4;
  // Where it is drawn on its parent.
  CanvasUiPosition position = 5;
}
// A listener a server serves, or that another server points at, identified by
// the server it lives on. `protocol` is one of `raw`, `relay_tcp`, `relay_tls`,
// `relay_quic`.
message ListenerCap {
  reserved 1; // ip
  uint32 port = 2;
  string protocol = 3;
  string server_id = 4;
}
message ForwardingDeps {
  ListenerCap serves = 1;
  repeated ListenerCap points_at = 2;
}
message ConfigSnapshot {
  int64 revision = 1;
  string created_at = 2;
  repeated ForwardingDeps forwardings = 3;
}

message CreateCanvasRequest {
  string name = 1;
  string description = 2;
  // Set to create a subcanvas drawn at `position` inside that canvas.
  string parent_id = 3;
  CanvasUiPosition position = 4;
}
message CreateCanvasReply {
  Canvas canvas = 1;
}
message ListCanvasesRequest {
  // Subcanvases (canvases with a parent) are omitted unless set.
  bool include_subcanvases = 1;
}
message ListCanvasesReply {
  repeated Canvas canvases = 1;
}
// Any canvas of the tree may be given; the reply is always the whole tree:
// every canvas, server, pod, exit, edge and group of it, and the diagnostics the
// graph checks with.
message GetGraphRequest {
  string canvas_id = 1;
}
message GetGraphReply {
  // Root first, then by depth.
  repeated Canvas canvases = 1;
  repeated Server servers = 2;
  repeated Pod pods = 3;
  repeated Exit exits = 4;
  repeated Edge edges = 5;
  repeated Group groups = 6;
  repeated Diagnostic diagnostics = 7;
  // The root's edit counter: pass it back as `expected_generation`.
  int64 generation = 8;
}
// One batch of changes to a tree's graph, all of it or none. A put replaces the
// row with its id, or creates it when no row has that id; ids of new rows are
// chosen by the caller (20 characters of `[a-z0-9]`), so one batch can create a
// pod, the edges into and out of it and the routes naming them. Deleting a pod
// or an exit takes no edge with it: delete the edges and rewrite the routes
// that name them in the same batch.
message GraphChange {
  repeated Pod put_pods = 1;
  repeated Exit put_exits = 2;
  repeated Edge put_edges = 3;
  repeated Group put_groups = 4;
  repeated string delete_pod_ids = 5;
  repeated string delete_exit_ids = 6;
  repeated string delete_edge_ids = 7;
  repeated string delete_group_ids = 8;
}
// `dry_run` answers the diagnostics without writing. `expected_generation`, when
// not 0, refuses a change computed against a tree that has moved on since.
message ApplyGraphRequest {
  string canvas_id = 1;
  GraphChange change = 2;
  bool dry_run = 3;
  int64 expected_generation = 4;
}
message ApplyGraphReply {
  bool applied = 1;
  int64 generation = 2;
  // Every diagnostic of the graph the change produces, and of the change itself;
  // any error means nothing was written.
  repeated Diagnostic diagnostics = 3;
  // The pods the change put, as written: one put with port 0 carries its port.
  repeated Pod pods = 4;
}
message ItemPosition {
  string id = 1;
  CanvasUiPosition position = 2;
}
// Where servers, exits and subcanvases are drawn; nothing a worker reads.
message MoveItemsRequest {
  // Any canvas of the tree the items belong to.
  string canvas_id = 1;
  repeated ItemPosition servers = 2;
  repeated ItemPosition exits = 3;
  repeated ItemPosition canvases = 4;
}
message MoveItemsReply {}
// Any canvas of the tree may be given; the reply is always the whole tree.
message GetCanvasTreeRequest {
  string canvas_id = 1;
}
message CanvasTreeNode {
  Canvas canvas = 1;
  repeated CanvasTreeNode children = 2;
}
message GetCanvasTreeReply {
  CanvasTreeNode root = 1;
}
message UpdateCanvasRequest {
  string canvas_id = 1;
  string name = 2;
  string description = 3;
  // Where a subcanvas is drawn on its parent; unset leaves it.
  CanvasUiPosition position = 4;
}
message UpdateCanvasReply {
  Canvas canvas = 1;
}
message DeleteCanvasRequest {
  string canvas_id = 1;
}
message DeleteCanvasReply {}
message CreateServerRequest {
  string canvas_id = 1;
  string name = 2;
  string icon = 3;
  string comment = 4;
  CanvasUiPosition position = 5;
  Ipv6Resolve ipv6_resolve = 6;
  string log_level = 7;
  // Empty strings clear the slot.
  string override_v4 = 8;
  string override_v6 = 9;
  repeated string extra_addresses = 10;
}
message CreateServerReply {
  Server server = 1;
}
message UpdateServerRequest {
  string server_id = 1;
  string name = 2;
  string icon = 3;
  string comment = 4;
  Ipv6Resolve ipv6_resolve = 5;
  string log_level = 6;
  // Empty strings clear the slot; `extra_addresses` replaces the whole list.
  string override_v4 = 7;
  string override_v6 = 8;
  repeated string extra_addresses = 9;
  // The systemd instance the install command targets (`guru-worker@<unit>`):
  // 1-32 lowercase letters, digits or dashes. Empty clears it.
  string agent_unit = 10;
  // Absent keeps quinn's defaults (every field zero).
  QuicSettings quic = 11;
}
message UpdateServerReply {
  Server server = 1;
}
// Issues the server's own agent key and renders the install command carrying
// it. The key appears exactly once, inside `command`; issuing again replaces
// it, so a worker still holding the previous key is refused at its next
// registration. `unit` empty keeps the stored instance name, or derives one
// from the server name. Maintainer+.
message IssueServerAgentInstallRequest {
  string server_id = 1;
  string unit = 2;
}
message IssueServerAgentInstallReply {
  string command = 1;
  string unit = 2;
  string version = 3;
  Server server = 4;
}
// The published worker release (`manage-tool agent publish`): empty `version`
// means none yet. `base_url_configured` is whether the install command has an
// origin to download from at all.
message GetAgentReleaseRequest {}
message GetAgentReleaseReply {
  string version = 1;
  string sha256 = 2;
  string arch = 3;
  string published_at = 4;
  bool base_url_configured = 5;
}
// Asks the server's worker to move to the published release: it picks the
// request up at its next poll, downloads and verifies the binary, swaps it in
// and restarts. `agent_update_requested` clears once the worker registers as
// that version, or with `agent_update_error` set when the attempt failed.
message RequestAgentUpdateRequest {
  string server_id = 1;
}
message RequestAgentUpdateReply {
  Server server = 1;
}
message DeleteServerRequest {
  string server_id = 1;
}
message DeleteServerReply {}
message MoveServerRequest {
  string server_id = 1;
  CanvasUiPosition position = 2;
}
message MoveServerReply {}

message GetServerConfigRequest {
  string server_id = 1;
}
message GetServerConfigReply {
  int64 revision = 1;
  string toml = 2;
}
message GetServerRolloutStatusRequest {
  string server_id = 1;
}
// One pod that could not be compiled on its own. `listen` is the `bind:port` it
// would have served (`[::]:port` for a wildcard bind), `error` why not.
message InvalidPod {
  string pod_id = 1;
  string pod_name = 2;
  string listen = 3;
  string error = 4;
}
// `waiting_for_server_ids` are servers whose applied config does not yet serve a
// listener this server's ideal config points at.
//
// `derive_error` is a whole-server derivation failure: nothing was published for
// this server at all. `invalid_pods` is the per-pod counterpart: only those pods
// failed, the rest of the server's config was derived and published normally,
// and each listed pod keeps whatever listener shape it was already serving. A
// server-level failure leaves `invalid_pods` empty.
message GetServerRolloutStatusReply {
  ConfigSnapshot desired = 1;
  ConfigSnapshot in_flight = 2;
  ConfigSnapshot applied = 3;
  string apply_error = 4;
  string derive_error = 5;
  repeated string waiting_for_server_ids = 6;
  bool derivation_pending = 7;
  string last_seen_at = 8;
  repeated InvalidPod invalid_pods = 9;
}
// Admin only: declares a server dead, which lets its dependants switch away from
// listeners it may in fact still be serving.
message ForgetServerAppliedRequest {
  string server_id = 1;
}
message ForgetServerAppliedReply {}

message ServerHealthRecord {
  string id = 1;
  string server_id = 2;
  ServerHealthStatus status = 3;
  string report_time = 4;
  int64 upload_bytes = 5;
  int64 download_bytes = 6;
  int64 current_connections = 7;
  int64 max_connections = 8;
}
message PodHealthRecord {
  string id = 1;
  string pod_id = 2;
  PodHealthStatus status = 3;
  string message = 4;
  string report_time = 5;
}
// `start` / `end` are RFC 3339; an empty `end` means now, an empty `start`
// means one hour before `end`.
message ListServerHealthHistoryRequest {
  string server_id = 1;
  string start = 2;
  string end = 3;
}
message ListServerHealthHistoryReply {
  repeated ServerHealthRecord records = 1;
}
// `limit` of 0 means the server default; records come newest first.
message ListPodHealthHistoryRequest {
  string pod_id = 1;
  string start = 2;
  string end = 3;
  uint32 limit = 4;
}
message ListPodHealthHistoryReply {
  repeated PodHealthRecord records = 1;
}

// DNS providers are Admin only. `api_secret` is write-only: it is never
// returned.
message DnsProvider {
  string id = 1;
  string name = 2;
  DnsProviderKind provider = 3;
  // Cloudflare: unused (the zone id lives on the pod's `TlsConfig.domain_id`).
  // Vercel: the team id, or empty for a personal account.
  string account_id = 4;
  string created_at = 5;
}
message CreateDnsProviderRequest {
  string name = 1;
  DnsProviderKind provider = 2;
  string account_id = 3;
  string api_secret = 4;
}
message CreateDnsProviderReply {
  DnsProvider provider = 1;
}
message ListDnsProvidersRequest {}
message ListDnsProvidersReply {
  repeated DnsProvider providers = 1;
}
// An empty `api_secret` keeps the stored secret.
message UpdateDnsProviderRequest {
  string dns_provider_id = 1;
  string name = 2;
  string account_id = 3;
  string api_secret = 4;
}
message UpdateDnsProviderReply {
  DnsProvider provider = 1;
}
// Refused while a pod still references the provider.
message DeleteDnsProviderRequest {
  string dns_provider_id = 1;
}
message DeleteDnsProviderReply {}

// One ACME certificate, identified by `(sni, acme_directory)`. Key material is
// never returned.
message Certificate {
  string id = 1;
  string sni = 2;
  string dns_provider_id = 3;
  string domain_id = 4;
  string acme_directory = 5;
  CertificateStatus status = 6;
  string not_before = 7;
  string not_after = 8;
  string last_error = 9;
  string last_attempt_at = 10;
}
message ListCertificatesRequest {}
message ListCertificatesReply {
  repeated Certificate certificates = 1;
}
// Admin only: clears a failure (or forces a renewal of an issued one) so the
// next renewal pass retries it.
message RetryCertificateRequest {
  string certificate_id = 1;
}
message RetryCertificateReply {
  Certificate certificate = 1;
}
// Admin only. Refused while a pod still references the certificate's
// `(sni, acme_directory)`.
message DeleteCertificateRequest {
  string certificate_id = 1;
}
message DeleteCertificateReply {}

// The `orchestration` configuration document
// (`orchestration::config::OrchestrationConfig`). Admin only: these values size
// every health threshold, retention window and certificate lifetime in the
// fleet.
message GetOrchestrationConfigRequest {}
message GetOrchestrationConfigReply {
  guru.base.ConfigDocument config = 1;
}
// `json` replaces the whole document. It is decoded into `OrchestrationConfig`
// first, so a payload of the wrong shape is rejected and the row keeps its
// previous contents. Masters pick the new values up on restart.
message SetOrchestrationConfigRequest {
  string json = 1;
}
message SetOrchestrationConfigReply {
  guru.base.ConfigDocument config = 1;
}

// ---- live streams -----------------------------------------------------------
// Every Watch* stream opens with a snapshot and then sends a new message per
// change; an empty KeepAlive is sent every `stream_keepalive_secs`. Streams need
// a human session and end with UNAUTHENTICATED once that session is gone, and
// with NOT_FOUND if the watched record disappears. The server never asks the
// client to re-request: a slow consumer receives fewer, newer snapshots.
message KeepAlive {}

// `since` is RFC 3339; empty means one hour ago.
message WatchServerHealthRequest {
  string server_id = 1;
  string since = 2;
}
message ServerHealthSnapshot {
  ServerHealthStatus status = 1;
  string last_seen_at = 2;
  repeated ServerHealthRecord records = 3; // oldest first
}
message ServerHealthEvent {
  oneof event {
    ServerHealthSnapshot snapshot = 1;
    ServerHealthRecord record = 2;
    KeepAlive keep_alive = 3;
  }
}
// Any canvas of a tree may be given; the snapshot covers every server of the tree.
message WatchRolloutsRequest {
  string canvas_id = 1;
}
message ServerRollout {
  string server_id = 1;
  string canvas_id = 2;
  GetServerRolloutStatusReply status = 3;
}
message RolloutSnapshot {
  repeated ServerRollout servers = 1;
}
message RolloutEvent {
  oneof event {
    RolloutSnapshot snapshot = 1;
    KeepAlive keep_alive = 2;
  }
}

service Orchestration {
  rpc CreateCanvas(CreateCanvasRequest) returns (CreateCanvasReply);
  rpc ListCanvases(ListCanvasesRequest) returns (ListCanvasesReply);
  rpc UpdateCanvas(UpdateCanvasRequest) returns (UpdateCanvasReply);
  rpc DeleteCanvas(DeleteCanvasRequest) returns (DeleteCanvasReply);
  rpc GetCanvasTree(GetCanvasTreeRequest) returns (GetCanvasTreeReply);
  rpc GetGraph(GetGraphRequest) returns (GetGraphReply);
  rpc ApplyGraph(ApplyGraphRequest) returns (ApplyGraphReply);
  rpc MoveItems(MoveItemsRequest) returns (MoveItemsReply);
  rpc CreateServer(CreateServerRequest) returns (CreateServerReply);
  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerReply);
  rpc DeleteServer(DeleteServerRequest) returns (DeleteServerReply);
  rpc MoveServer(MoveServerRequest) returns (MoveServerReply);
  rpc GetServerConfig(GetServerConfigRequest) returns (GetServerConfigReply);
  rpc GetServerRolloutStatus(GetServerRolloutStatusRequest) returns (GetServerRolloutStatusReply);
  rpc ForgetServerApplied(ForgetServerAppliedRequest) returns (ForgetServerAppliedReply);
  rpc IssueServerAgentInstall(IssueServerAgentInstallRequest) returns (IssueServerAgentInstallReply);
  rpc GetAgentRelease(GetAgentReleaseRequest) returns (GetAgentReleaseReply);
  rpc RequestAgentUpdate(RequestAgentUpdateRequest) returns (RequestAgentUpdateReply);
  rpc ListServerHealthHistory(ListServerHealthHistoryRequest) returns (ListServerHealthHistoryReply);
  rpc ListPodHealthHistory(ListPodHealthHistoryRequest) returns (ListPodHealthHistoryReply);
  rpc WatchServerHealth(WatchServerHealthRequest) returns (stream ServerHealthEvent);
  rpc WatchRollouts(WatchRolloutsRequest) returns (stream RolloutEvent);
  rpc CreateDnsProvider(CreateDnsProviderRequest) returns (CreateDnsProviderReply);
  rpc ListDnsProviders(ListDnsProvidersRequest) returns (ListDnsProvidersReply);
  rpc UpdateDnsProvider(UpdateDnsProviderRequest) returns (UpdateDnsProviderReply);
  rpc DeleteDnsProvider(DeleteDnsProviderRequest) returns (DeleteDnsProviderReply);
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesReply);
  rpc RetryCertificate(RetryCertificateRequest) returns (RetryCertificateReply);
  rpc DeleteCertificate(DeleteCertificateRequest) returns (DeleteCertificateReply);
  rpc GetOrchestrationConfig(GetOrchestrationConfigRequest) returns (GetOrchestrationConfigReply);
  rpc SetOrchestrationConfig(SetOrchestrationConfigRequest) returns (SetOrchestrationConfigReply);
}
