syntax = "proto3";

package guru.orchestration.agent;

// The worker control plane. `Register` is authenticated with an operator API
// key (`x-api-key`, Maintainer+); `WatchConfig`, `AckConfig` and
// `ReportHealth` are authenticated with the dynamic refresh key
// (`x-refresh-key`) that `Register` returned.
service WorkerAgent {
  rpc Register(RegisterRequest) returns (RegisterReply);
  // Sends a keep-alive every `RegisterReply.stream_keepalive_secs` to a worker
  // that asked for them, so no proxy on the path sees a silent stream.
  rpc WatchConfig(WatchConfigRequest) returns (stream ConfigRevision);
  rpc AckConfig(AckConfigRequest) returns (AckConfigReply);
  // One report per interval for as long as the worker lives, one reply per
  // report the master recorded; the reply stream opens before the first report
  // is recorded. The stream closing does not mark the server offline — a proxy
  // cutting it is not the worker going away. Silence does: no report for
  // `health_offline_after`, and the master ends the stream with
  // `DEADLINE_EXCEEDED` and marks the server `Offline`.
  //
  // A worker built before the replies (tonic 0.14 `client_streaming`) takes
  // the first reply and drains the rest, so its call still ends only when the
  // stream does.
  rpc ReportHealth(stream HealthReport) returns (stream ReportHealthReply);
  // Asked every `agent_update_poll_secs`: whether the operator requested an
  // update for this server, and how the previous attempt went.
  rpc PollAgentUpdate(PollAgentUpdateRequest) returns (PollAgentUpdateReply);
}

// What the worker knows about its own addresses. An empty string means the
// worker could not learn that address; the master keeps whatever it had.
message ReportedAddresses {
  // Learned from `--public-ip-urls` over IPv4 / IPv6.
  string public_v4 = 1;
  string public_v6 = 2;
  // Non-loopback, non-link-local interface addresses, sorted and deduplicated.
  repeated string interfaces = 3;
  // Was the worker-looked-up country; the master now looks the country of a
  // server's IPv4 up itself. A worker still sending it is ignored.
  reserved 4;
  reserved "country";
}
message RegisterRequest {
  string server_id = 1;
  int64 running_revision = 2;
  // Best effort; may be unset.
  ReportedAddresses reported_addresses = 3;
  // The worker's own build: its crate version and the CPU architecture it was
  // built for (`x86_64`, `aarch64`). Empty — an older worker — leaves whatever
  // the master had.
  string agent_version = 4;
  string agent_arch = 5;
  // Why the last self-update on this host failed, as the start guard recorded
  // it and the worker found it at startup. Empty when there is nothing to tell.
  string last_update_error = 6;
  // What this worker understands beyond the config every worker reads:
  // `route_table` (a forwarding's `to` naming its own groups and upstreams) and
  // `relay_confirm` (answering a dialer that asks, in its PROXY header, whether
  // the relay's own next hop connected). Empty for workers built before either.
  repeated string capabilities = 7;
}
message RegisterReply {
  string refresh_key = 1;
  // How often the master expects a `HealthReport`; the worker schedules from
  // this so the two sides never disagree on the offline threshold.
  uint32 health_report_interval_secs = 2;
  // How often the worker should ask `PollAgentUpdate`; `0` leaves the worker's
  // own default.
  uint32 agent_update_poll_secs = 3;
  // How often `WatchConfig` sends a keep-alive to a worker that asked for them.
  // Non-zero also means `ReportHealth` answers every recorded report, so the
  // worker may end a session whose streams stay silent for three of these (or
  // three health intervals). `0`: a master built before either; the worker
  // expects neither.
  uint32 stream_keepalive_secs = 4;
}
message WatchConfigRequest {
  // The worker skips `ConfigRevision.keep_alive` messages. A worker built
  // before them sends `false` and is sent none: it would apply one as an empty
  // config.
  bool keep_alive = 1;
}
// A file the worker writes under its state directory before applying `toml`.
// `path` is relative to the state directory and is exactly what the TOML's
// `key` / `full_chain` / `relay_ca` fields reference.
message CertificateFile {
  string path = 1;
  string pem = 2;
}
message ConfigRevision {
  int64 revision = 1;
  string toml = 2;
  repeated CertificateFile files = 3;
  // Set on a keep-alive, which carries nothing else and is neither applied nor
  // acknowledged. Only sent on a stream whose request set `keep_alive`.
  bool keep_alive = 4;
}
// The outcome of one `[[forwarding]]` (keyed by its `tag`, the pod name).
// Unset `error` means the pod runs the shape the revision asked for.
message PodStatus {
  string tag = 1;
  optional string error = 2;
}
// A revision is applied per pod: every `[[forwarding]]` that prepares and binds
// is committed, and a pod that fails keeps whatever listener it had before (or
// none). `pods` lists every pod of the revision with its outcome. `error` is
// only set when the revision could not be applied at all (unparsable TOML,
// unwritable certificate files), in which case `pods` is empty and nothing
// changed on the worker.
message AckConfigRequest {
  int64 revision = 1;
  optional string error = 2;
  repeated PodStatus pods = 3;
}
message AckConfigReply {}
message HealthReport {
  int64 running_revision = 1;
  // Deltas since the previous report.
  int64 upload_bytes = 2;
  int64 download_bytes = 3;
  int64 current_connections = 4;
  // High-water mark since the previous report.
  int64 max_connections = 5;
  // One entry per running `[[forwarding]]`.
  repeated PodStatus pods = 6;
  // Set only on a report whose address discovery changed something.
  ReportedAddresses reported_addresses = 7;
}
// One per `HealthReport` the master recorded, in order.
message ReportHealthReply {}
// A non-empty `last_error` is why the previous update attempt failed (download,
// checksum, install, or self-update disabled on the host); the master records
// it, drops the request, and answers with no update.
message PollAgentUpdateRequest {
  string last_error = 1;
}
// The published binary the operator asked this worker to move to. `url` is
// under the master's own origin; `sha256` is what the worker verifies before
// installing.
message AgentUpdate {
  string version = 1;
  string url = 2;
  string sha256 = 3;
}
message PollAgentUpdateReply {
  optional AgentUpdate update = 1;
}
