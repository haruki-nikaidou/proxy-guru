syntax = "proto3";

package guru.orchestration.agent;

// The worker control plane. `Register` is authenticated with an operator API
// key (`x-api-key`, Maintainer+); `WatchConfig`, `AckConfig`, `ReportHealth`,
// `PollAgentUpdate` and `ShellChannel` are authenticated with the dynamic
// refresh key (`x-refresh-key`) that `Register` returned.
service WorkerAgent {
  rpc Register(RegisterRequest) returns (RegisterReply);
  // Sends a keep-alive every `RegisterReply.stream_keepalive_secs` to a worker
  // that asked for them, so no proxy on the path sees a silent stream.
  rpc WatchConfig(WatchConfigRequest) returns (stream ConfigRevision);
  rpc AckConfig(AckConfigRequest) returns (AckConfigReply);
  // One report per interval for as long as the worker lives, one reply per
  // report the master recorded; the reply stream opens before the first report
  // is recorded. The stream closing does not mark the server offline — a proxy
  // cutting it is not the worker going away. Silence does: no report for
  // `health_offline_after`, and the master ends the stream with
  // `DEADLINE_EXCEEDED` and marks the server `Offline`.
  //
  // A worker built before the replies (tonic 0.14 `client_streaming`) takes
  // the first reply and drains the rest, so its call still ends only when the
  // stream does.
  rpc ReportHealth(stream HealthReport) returns (stream ReportHealthReply);
  // Asked every `agent_update_poll_secs`: whether the operator requested an
  // update for this server, and how the previous attempt went.
  rpc PollAgentUpdate(PollAgentUpdateRequest) returns (PollAgentUpdateReply);
  // Remote shell. Only a worker whose host opted in locally (and which
  // therefore advertised `remote_shell` at `Register`) opens it, right after
  // `Register`, authenticated with `x-refresh-key`. A newer registration
  // supersedes the stream, exactly as it does `WatchConfig`.
  //
  // The master is a stateless relay: it hands dashboard requests down and the
  // worker's replies and transcript events up, and stores nothing. Sessions,
  // their shells and their output buffers live on the worker and outlive the
  // stream. Both sides send a `ShellKeepAlive` every
  // `RegisterReply.stream_keepalive_secs` and end a stream that stays silent
  // for three of them.
  rpc ShellChannel(stream ShellUp) returns (stream ShellDown);
}

// What the worker knows about its own addresses. An empty string means the
// worker could not learn that address; the master keeps whatever it had.
message ReportedAddresses {
  // Learned from `--public-ip-urls` over IPv4 / IPv6.
  string public_v4 = 1;
  string public_v6 = 2;
  // Non-loopback, non-link-local interface addresses, sorted and deduplicated.
  repeated string interfaces = 3;
  // Was the worker-looked-up country; the master now looks the country of a
  // server's IPv4 up itself. A worker still sending it is ignored.
  reserved 4;
  reserved "country";
}
message RegisterRequest {
  string server_id = 1;
  int64 running_revision = 2;
  // Best effort; may be unset.
  ReportedAddresses reported_addresses = 3;
  // The worker's own build: its crate version and the CPU architecture it was
  // built for (`x86_64`, `aarch64`). Empty — an older worker — leaves whatever
  // the master had.
  string agent_version = 4;
  string agent_arch = 5;
  // Why the last self-update on this host failed, as the start guard recorded
  // it and the worker found it at startup. Empty when there is nothing to tell.
  string last_update_error = 6;
  // What this worker understands beyond the config every worker reads:
  // `route_table` (a forwarding's `to` naming its own groups and upstreams),
  // `relay_confirm` (answering a dialer that asks, in its PROXY header, whether
  // the relay's own next hop connected) and `remote_shell` (built with the
  // feature *and* opted in on its host; it opens `ShellChannel`). Empty for
  // workers built before any of them.
  repeated string capabilities = 7;
}
message RegisterReply {
  string refresh_key = 1;
  // How often the master expects a `HealthReport`; the worker schedules from
  // this so the two sides never disagree on the offline threshold.
  uint32 health_report_interval_secs = 2;
  // How often the worker should ask `PollAgentUpdate`; `0` leaves the worker's
  // own default.
  uint32 agent_update_poll_secs = 3;
  // How often `WatchConfig` sends a keep-alive to a worker that asked for them.
  // Non-zero also means `ReportHealth` answers every recorded report, so the
  // worker may end a session whose streams stay silent for three of these (or
  // three health intervals). `0`: a master built before either; the worker
  // expects neither.
  uint32 stream_keepalive_secs = 4;
}
message WatchConfigRequest {
  // The worker skips `ConfigRevision.keep_alive` messages. A worker built
  // before them sends `false` and is sent none: it would apply one as an empty
  // config.
  bool keep_alive = 1;
}
// A file the worker writes under its state directory before applying `toml`.
// `path` is relative to the state directory and is exactly what the TOML's
// `key` / `full_chain` / `relay_ca` fields reference.
message CertificateFile {
  string path = 1;
  string pem = 2;
}
message ConfigRevision {
  int64 revision = 1;
  string toml = 2;
  repeated CertificateFile files = 3;
  // Set on a keep-alive, which carries nothing else and is neither applied nor
  // acknowledged. Only sent on a stream whose request set `keep_alive`.
  bool keep_alive = 4;
}
// The outcome of one `[[forwarding]]` (keyed by its `tag`, the pod name).
// Unset `error` means the pod runs the shape the revision asked for.
message PodStatus {
  string tag = 1;
  optional string error = 2;
}
// A revision is applied per pod: every `[[forwarding]]` that prepares and binds
// is committed, and a pod that fails keeps whatever listener it had before (or
// none). `pods` lists every pod of the revision with its outcome. `error` is
// only set when the revision could not be applied at all (unparsable TOML,
// unwritable certificate files), in which case `pods` is empty and nothing
// changed on the worker.
message AckConfigRequest {
  int64 revision = 1;
  optional string error = 2;
  repeated PodStatus pods = 3;
}
message AckConfigReply {}
message HealthReport {
  int64 running_revision = 1;
  // Deltas since the previous report.
  int64 upload_bytes = 2;
  int64 download_bytes = 3;
  int64 current_connections = 4;
  // High-water mark since the previous report.
  int64 max_connections = 5;
  // One entry per running `[[forwarding]]`.
  repeated PodStatus pods = 6;
  // Set only on a report whose address discovery changed something.
  ReportedAddresses reported_addresses = 7;
}
// One per `HealthReport` the master recorded, in order.
message ReportHealthReply {}
// A non-empty `last_error` is why the previous update attempt failed (download,
// checksum, install, or self-update disabled on the host); the master records
// it, drops the request, and answers with no update.
message PollAgentUpdateRequest {
  string last_error = 1;
}
// The published binary the operator asked this worker to move to. `url` is
// under the master's own origin; `sha256` is what the worker verifies before
// installing.
message AgentUpdate {
  string version = 1;
  string url = 2;
  string sha256 = 3;
}
message PollAgentUpdateReply {
  optional AgentUpdate update = 1;
}

// ---- remote shell -----------------------------------------------------------

// Master → worker.
message ShellDown {
  oneof message {
    ShellRequest request = 1;
    ShellAttach attach = 2;
    ShellDetach detach = 3;
    ShellRenew renew = 4;
    ShellKeepAlive keep_alive = 5;
  }
}
// Worker → master.
message ShellUp {
  oneof message {
    ShellReply reply = 1;
    ShellWatchEvent event = 2;
    ShellKeepAlive keep_alive = 3;
  }
}
message ShellKeepAlive {}

// One dashboard call. `request_id` is opaque to the worker and echoed in the
// one `ShellReply` it answers with.
message ShellRequest {
  string request_id = 1;
  oneof op {
    ShellOpen open = 2;
    ShellExec exec = 3;
    ShellClose close = 4;
    ShellList list = 5;
  }
}
// Spawns a new shell; answered with `opened`.
message ShellOpen {}
// Writes `command` to the session's shell; answered with `done` as soon as the
// command was accepted, not when it finishes (that is a `ShellCommandFinished`
// event). Refused with `BUSY` while another command runs: commands are never
// queued.
message ShellExec {
  string session_id = 1;
  string command = 2;
}
// Kills the session's process group; answered with `done`.
message ShellClose {
  string session_id = 1;
}
// Answered with `sessions`.
message ShellList {}

message ShellReply {
  string request_id = 1;
  oneof result {
    ShellSessionInfo opened = 2;
    ShellDone done = 3;
    ShellSessionList sessions = 4;
    ShellError error = 5;
  }
}
message ShellDone {}
message ShellSessionList {
  repeated ShellSessionInfo sessions = 1;
}
message ShellSessionInfo {
  string session_id = 1;
  // Unix seconds.
  int64 opened_at = 2;
  // The command running now; unset while the shell is idle.
  optional string running = 3;
  // The transcript position the session's next event starts at.
  uint64 end_offset = 4;
  // How many watches are attached right now.
  uint32 viewers = 5;
}
enum ShellErrorCode {
  SHELL_ERROR_CODE_UNSPECIFIED = 0;
  // No such session: closed, reaped, or the worker restarted since.
  SHELL_ERROR_CODE_NOT_FOUND = 1;
  // A command is still running in the session.
  SHELL_ERROR_CODE_BUSY = 2;
  // The worker's local session cap is reached.
  SHELL_ERROR_CODE_LIMIT = 3;
  // The request itself is unusable (an empty command, a NUL byte, too long).
  SHELL_ERROR_CODE_INVALID = 4;
  // Anything else: the shell could not be spawned or written to.
  SHELL_ERROR_CODE_FAILED = 5;
}
message ShellError {
  ShellErrorCode code = 1;
  string message = 2;
}

// Starts the watch `watch_id` on a session at transcript position
// `from_offset`. Attaching an id that is already attached restarts it from the
// new position, so a relay that suspects a gap simply attaches again. A session
// may have any number of watches, each with its own cursor.
message ShellAttach {
  string watch_id = 1;
  string session_id = 2;
  uint64 from_offset = 3;
}
message ShellDetach {
  string watch_id = 1;
}
// Sent periodically for every live watch. The worker drops a watch that goes
// unrenewed for a while (its relay died without a `ShellDetach`), and answers a
// renewal of a watch it holds with a `keep_alive` event.
message ShellRenew {
  string watch_id = 1;
}
message ShellWatchEvent {
  string watch_id = 1;
  ShellEvent event = 2;
}

// One entry of a session's transcript, or a notice about the watch.
//
// `offset` is where the event starts in the transcript. Output occupies one
// position per byte; `started` and `finished` occupy one position each;
// `truncated`, `closed`, `keep_alive` and `error` occupy none. A watch resumes
// at `offset` plus that length.
message ShellEvent {
  uint64 offset = 1;
  oneof event {
    ShellOutput output = 2;
    ShellCommandStarted started = 3;
    ShellCommandFinished finished = 4;
    // The watch asked for positions the ring buffer no longer holds: `dropped`
    // positions were skipped and it continues at `offset`, the oldest one kept.
    ShellTruncated truncated = 5;
    // The session ended; the watch ends with it.
    ShellSessionClosed closed = 6;
    ShellKeepAlive keep_alive = 7;
    // The watch could not start (`NOT_FOUND`); the watch ends.
    ShellError error = 8;
  }
}
enum ShellStream {
  SHELL_STREAM_UNSPECIFIED = 0;
  SHELL_STREAM_STDOUT = 1;
  SHELL_STREAM_STDERR = 2;
}
message ShellOutput {
  ShellStream stream = 1;
  bytes data = 2;
}
message ShellCommandStarted {
  string command = 1;
}
// `exit_code` is the shell's `$?`: 128 + n for a command killed by signal n.
message ShellCommandFinished {
  int32 exit_code = 1;
}
message ShellTruncated {
  uint64 dropped = 1;
}
enum ShellCloseReason {
  SHELL_CLOSE_REASON_UNSPECIFIED = 0;
  // An explicit `ShellClose`.
  SHELL_CLOSE_REASON_CLOSED = 1;
  // Reaped by the worker's idle timeout.
  SHELL_CLOSE_REASON_IDLE = 2;
  // The shell exited on its own (`exit`).
  SHELL_CLOSE_REASON_EXITED = 3;
  // The worker is stopping (shutdown or self-update).
  SHELL_CLOSE_REASON_SHUTDOWN = 4;
}
message ShellSessionClosed {
  ShellCloseReason reason = 1;
}
