ipv6_resolve = "tolerated"
relay_ca = "certs/ca.pem"

[log]
level = "info"

[[forwarding]]
tag = "osaka-hop"
listen = "198.51.100.10:9443"

[forwarding.listen_as.relay]
relay_type = "quic"
key = "certs/relay/pod_osaka/key.pem"
full_chain = "certs/relay/pod_osaka/full_chain.pem"

[forwarding.to]
type = "exit"
destination = "10.0.0.5:8080"
