ipv6_resolve = "tolerated"

[log]
level = "info"

[[forwarding]]
tag = "edge"
listen = "[::]:443"
receive_proxy_protocol = "v2"
listen_as = "raw"

[forwarding.to]
type = "load_balance"
strategy = "fallback"

[[forwarding.to.members]]
type = "exit"
destination = "10.0.0.5:8080"

[[forwarding.to.members]]
type = "exit"
destination = "backend.internal:9000"

[[forwarding.to.members]]
type = "exit"
destination = "10.0.0.7:8080"
