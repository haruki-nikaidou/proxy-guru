ipv6_resolve = "tolerated"

[log]
level = "info"

[[forwarding]]
tag = "alpha"
listen = "[::]:443"
listen_as = "raw"

[forwarding.to]
type = "exit"
destination = "10.0.0.5:8080"

[[forwarding]]
tag = "beta"
listen = "[::]:8443"
listen_as = "raw"

[forwarding.to]
type = "exit"
destination = "10.0.0.5:8080"
