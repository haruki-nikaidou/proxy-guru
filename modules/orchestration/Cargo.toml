[package]
name = "orchestration"
version = "0.3.0-beta"  # master side
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Internal
rpguru_sdk = { path = "../../lib/rpguru_sdk" }
newtype_record_id = { path = "../../lib/newtype_record_id" }
guru_worker_config = { path = "../../lib/guru_worker_config" }
auth = { path = "../auth" }
base = { path = "../base" }

# Framework
wakuwaku = { workspace = true }
kanau = { workspace = true }
tokio = { workspace = true }

# Persistence
surrealdb = { workspace = true }
surrealdb-types = { workspace = true }

# Messaging
amqprs = { workspace = true }
redis = { workspace = true }

# gRPC / transport
tonic = { workspace = true }
tower = { workspace = true }

# Serialization
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Certificates and secrets
instant-acme = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
chacha20poly1305 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
hickory-resolver = { workspace = true }

# Data types
chrono = { workspace = true }
time = { workspace = true }
smallvec = { workspace = true }

# Tracing
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Streaming
tokio-stream = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
surrealdb = { workspace = true, features = ["kv-mem"] }
testcontainers-modules = { version = "0.15.0", features = ["rabbitmq", "redis"] }
x509-parser = { workspace = true, features = ["verify-aws"] }
tokio = { workspace = true }
