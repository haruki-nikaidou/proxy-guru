[workspace]
resolver = "3"
members = [
    "bin/guru-master",
    "bin/guru-worker",
    "bin/manage-tool",
    "lib/guru_topology",
    "lib/guru_worker_config",
    "lib/db_types",
    "lib/rpguru_sdk",
    "modules/auth",
    "modules/base",
    "modules/notify",
    "modules/orchestration"
]

[workspace.package]
# Versions are decoupled per component group; each crate declares its own:
#   master side — bin/guru-master, bin/manage-tool, modules/*, lib/db_types
#   API         — lib/rpguru_sdk, typescript/app-protobuf
#   worker side — bin/guru-worker, lib/guru_worker_config
#   frontend    — typescript/guru-frontend
authors = []
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Runtime
tokio = { version = "1.49", features = ["full"] }

# Framework
wakuwaku = { version = "0.2.3", features = ["tracing-otel", "tonic", "sqlx"] }
kanau = { version = "0.5", features = [
    "message",
    "rkyv",
    "bincode",
    "serde_json",
] }
amqprs = { version = "2.1", features = ["uriparse", "urispec"] }
# PostgreSQL. Every statement goes through the `query!` family, so the SQL is
# checked against the schema at compile time; `.sqlx/` carries the offline data
# for builds without a database (`cargo sqlx prepare --workspace`).
# `sqlx-toml` is what makes the per-crate `sqlx.toml` (which pins `chrono` as
# the date/time crate for the macros) take effect.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "json",
    "derive",
    "macros",
    "migrate",
    "sqlx-toml",
] }
redis = { version = "1.0", features = [
    "tokio-comp",
    "uuid",
    "json",
    "connection-manager",
] }
axum = { version = "0.8", features = ["macros", "form"] }
tower = "0.5"

# gRPC
tonic-prost-build = "0.14"
tonic = { version = "0.14", features = ["router", "server"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Serialization & Deserialization
rkyv = { version = "0.8", features = ["uuid-1", "bytecheck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1.19"
bytes = "1.10"
fast32 = "1.0.3"
bincode = { version = "2.0.1", features = ["serde"] }
urlencoding = "2.1"

# Data types
uuid = { version = "1.10", features = ["serde", "v4", "v7"] }
rust_decimal = { version = "1.37", features = ["rkyv"] }
compact_str = { version = "0.10", features = ["serde", "bytes", "smallvec"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
smallvec = { version = "1.14.0", features = [
    "serde",
    "union",
    "const_generics",
    "const_new",
] }

# External tools
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "zstd", "deflate"] }
clap = { version = "4.5", features = ["derive", "env"] }

# Auth & Security
rand = "0.9.1"
argon2 = "0.5"
# `SaltString::generate(OsRng)` needs `rand_core/getrandom`; nothing else in the tree turns it on.
password-hash = { version = "0.5", features = ["getrandom"] }
validator = "0.20.0"
jsonwebtoken = "9.2.0"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# Certificates
instant-acme = { version = "0.8", default-features = false, features = ["aws-lc-rs", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
x509-parser = "0.18"
chacha20poly1305 = "0.11"
base64 = "0.22"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }

# OpenTelemetry
opentelemetry = { version = "0.31", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["metrics"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "metrics", "logs", "grpc-tonic"] }
tracing-opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry-appender-tracing = "0.31"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Streaming
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Algorithm
itertools = "0.14"

# quinn-proto with a pacing patch: a congestion controller that reports a pacing
# rate has the pacer refill at that rate (needed by the worker's brutal sender).
# The diff against the upstream release is in vendor/quinn-proto/PATCH.md.
[patch.crates-io]
quinn-proto = { path = "vendor/quinn-proto" }
